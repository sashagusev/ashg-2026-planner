<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASHG 2026 · Program Planner</title>
<meta name="description" content="An elegant, fast planner for the ASHG 2026 Annual Meeting program — filter sessions by day, track, type, and room." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#ffffff;
  --bg-1:#fbfbfc;
  --bg-2:#f3f3f5;
  --panel:#ffffff;
  --elevated:#ffffff;
  --border:#eaeaec;
  --border-2:#d9d9de;
  --text:#1b1c1f;
  --text-2:#585a63;
  --text-3:#8b8d96;
  --accent:#5e6ad2;
  --accent-2:#4a56c0;
  --accent-soft:rgba(94,106,210,.10);
  --star:#dba100;
  --radius:10px;
  --radius-sm:7px;
  --shadow:0 1px 2px rgba(20,21,26,.04), 0 6px 24px rgba(20,21,26,.07);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-soft);color:var(--text)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#d5d5da;border-radius:6px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:#c0c0c7}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.sidebar{
  border-right:1px solid var(--border);
  background:var(--bg-1);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:0;
}
.main{min-width:0;display:flex;flex-direction:column}
.scrim{display:none}

/* ---------- Header ---------- */
.brand{
  display:flex;align-items:center;gap:11px;
  padding:18px 20px 16px;
}
.brand .logo{
  width:30px;height:30px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,#7c85f3,#b06ab3 55%,#e2607a);
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset;
  display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px;letter-spacing:.02em;
}
.brand h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--text-3);margin-top:1px}

.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--border);
  padding:12px 22px;
  display:flex;align-items:center;gap:14px;
}
.search{
  position:relative;flex:1;max-width:520px;
}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search input{
  width:100%;background:var(--bg-2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:8px 30px 8px 34px;font-size:13.5px;outline:none;
  transition:border-color .12s,box-shadow .12s;
}
.search input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.search input::placeholder{color:var(--text-3)}
.search .kbd{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--text-3);border:1px solid var(--border-2);border-radius:5px;
  padding:1px 6px;background:var(--bg-1);pointer-events:none;
}
.topbar .count{margin-left:auto;color:var(--text-3);font-size:12.5px;white-space:nowrap}

/* ---------- Sidebar filter groups ---------- */
.side-sec{padding:6px 12px 14px}
.side-sec + .side-sec{border-top:1px solid var(--border)}
.side-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 8px 6px;color:var(--text-3);
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
}
.side-head .clr{
  color:var(--text-3);font-size:11px;text-transform:none;letter-spacing:0;
  background:none;border:none;padding:2px 4px;border-radius:5px;visibility:hidden;
}
.side-head .clr:hover{color:var(--text);background:var(--bg-2)}
.side-sec.has-active .clr{visibility:visible}
.opt{
  display:flex;align-items:center;gap:9px;
  padding:6px 8px;border-radius:7px;color:var(--text-2);
  font-size:13px;user-select:none;cursor:pointer;position:relative;
  transition:background .1s,color .1s;
}
.opt:hover{background:var(--bg-2);color:var(--text)}
.opt .box{
  width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border-2);
  flex:none;display:grid;place-items:center;transition:all .12s;
}
.opt .box svg{width:10px;height:10px;opacity:0;transform:scale(.6);transition:all .12s}
.opt.on .box{background:var(--accent);border-color:var(--accent)}
.opt.on .box svg{opacity:1;transform:scale(1)}
.opt.on{color:var(--text)}
.opt .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .n{color:var(--text-3);font-size:11.5px;font-variant-numeric:tabular-nums}
.opt .dot{width:8px;height:8px;border-radius:3px;flex:none}

.side-reset{
  margin:2px 8px 8px;width:calc(100% - 16px);
  background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);
  padding:8px;border-radius:8px;font-size:12.5px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.side-reset:hover{color:var(--text);border-color:var(--border-2)}
.side-reset:disabled{opacity:.4;cursor:default}

/* ---------- Day chips (top of list) ---------- */
.daybar{
  display:flex;gap:7px;padding:14px 22px 4px;flex-wrap:wrap;align-items:center;
}
.chip{
  background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);
  padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:all .12s;
}
.chip:hover{color:var(--text);border-color:var(--border-2)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-2);box-shadow:0 0 0 1px var(--accent) inset;font-weight:600}
.chip .c{color:var(--text-3);margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on .c{color:var(--accent)}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:auto;padding:2px}
.seg button{background:none;border:none;color:var(--text-3);padding:5px 11px;font-size:12.5px;font-weight:500;border-radius:6px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(20,21,26,.08)}

/* ---------- Session list ---------- */
.list{padding:6px 22px 80px;max-width:1080px}
.daygroup{margin-top:18px}
.daygroup-h{
  position:sticky;top:57px;z-index:10;
  display:flex;align-items:baseline;gap:10px;padding:8px 2px;margin-bottom:4px;
  background:linear-gradient(var(--bg) 62%,rgba(255,255,255,0));
}
.daygroup-h .d{font-size:13px;font-weight:600;letter-spacing:-.01em}
.daygroup-h .n{font-size:12px;color:var(--text-3)}
.timedivider{height:0;border-top:1px solid var(--border-2);margin:16px 2px}

.card{
  border:1px solid var(--border);border-radius:5px;background:var(--panel);
  margin-bottom:8px;overflow:hidden;transition:border-color .12s,background .12s;
  scroll-margin-top:72px;
}
.pres{scroll-margin-top:72px}
.poster{scroll-margin-top:72px}
@keyframes flashpulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}30%{box-shadow:0 0 0 3px var(--accent-soft)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.flash{animation:flashpulse 1.3s ease-out;border-color:var(--accent) !important}
.card:hover{border-color:var(--border-2)}
.card.open{border-color:var(--border-2);background:var(--bg-1)}
.card-row{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:16px;padding:13px 14px;cursor:pointer;align-items:start}
.time{
  font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;padding-top:1px;line-height:1.35;
  min-width:0;white-space:nowrap;
}
.time .t1{color:var(--text);font-weight:500;display:block}
.time .t2{color:var(--text-3);display:block}
.body{min-width:0}
.title{font-size:14px;font-weight:550;letter-spacing:-.01em;color:var(--text);margin:0 0 6px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.badge{
  font-size:11px;font-weight:500;padding:2.5px 8px;border-radius:6px;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.badge .dot{width:7px;height:7px;border-radius:2px}
.badge.type{background:var(--bg-2);color:var(--text-2);border:1px solid var(--border)}
.tag{font-size:11.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:4px}
.tag svg{width:12px;height:12px;opacity:.75;flex:none}
.tag.room{color:var(--text-2)}
.people{color:var(--text-3);font-size:12px;margin-top:7px;line-height:1.45}
.people b{color:var(--text-2);font-weight:500}
.card-side{display:flex;align-items:center;gap:2px}
.star{
  background:none;border:none;padding:6px;border-radius:7px;color:var(--text-3);
  display:grid;place-items:center;transition:all .12s;
}
.star:hover{background:var(--bg-2);color:var(--star)}
.star.on{color:var(--star)}
.star svg{width:17px;height:17px}
.chev{color:var(--text-3);padding:6px;display:grid;place-items:center;transition:transform .18s}
.card.open .chev{transform:rotate(90deg)}

/* ---------- Expanded detail ---------- */
.detail{border-top:1px solid var(--border);padding:0 14px;display:none}
.card.open .detail{display:block;padding:14px 14px 16px}
.detail .info{color:var(--text-2);font-size:13px;line-height:1.6;margin-bottom:2px}
.detail .info p{margin:0 0 9px}
.detail .info a{color:var(--accent);word-break:break-word}
.detail .info b,.detail .info strong{color:var(--text);font-weight:600}
.detail .info br{content:"";display:block;margin:2px 0}
.detail-people{display:flex;flex-direction:column;gap:5px;margin:12px 0 2px}
.pgroup{font-size:12.5px;color:var(--text-2)}
.pgroup .role{color:var(--text-3);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;font-weight:600;margin-right:8px}
.person{color:var(--text);}
.person .aff{color:var(--text-3)}
.subheat{margin-top:16px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:8px}
.subheat::after{content:"";height:1px;background:var(--border);flex:1}
.pres{padding:11px 0;margin:0}
.pres + .pres{border-top:1px solid var(--border)}
.pres-t{display:flex;gap:12px;align-items:baseline}
.pres-time{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.pres-title{font-size:13px;color:var(--text);font-weight:500;line-height:1.4;min-width:0}
.pres-people{font-size:12px;color:var(--text-3);margin-top:3px}
.pres-abs{font-size:12.5px;color:var(--text-2);line-height:1.55;margin-top:6px;display:none}
.pres.exp .pres-abs{display:block}
.pres-more{font-size:11.5px;color:var(--accent);cursor:pointer;margin-top:5px;display:inline-block}
.pres-abs p{margin:0 0 7px}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:80px 20px;color:var(--text-3)}
.empty h3{color:var(--text-2);font-weight:600;margin:0 0 6px;font-size:15px}
.loading{padding:60px;text-align:center;color:var(--text-3)}

/* ---------- View switch ---------- */
.viewswitch{display:flex;gap:2px;margin:2px 12px 8px;padding:3px;background:var(--bg-2);border:1px solid var(--border);border-radius:9px}
.viewswitch button{flex:1;background:none;border:none;color:var(--text-2);font-size:12.5px;font-weight:500;padding:6px 8px;border-radius:6px}
.viewswitch button:hover{color:var(--text)}
.viewswitch button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(20,21,26,.08)}
.opt.pnav .lbl{font-size:12.5px}
.opt.pnav.on{background:var(--accent-soft);color:var(--accent-2)}
.opt.pnav.on .lbl{color:var(--accent-2);font-weight:500}
.opt.pnav.on .n{color:var(--accent)}

/* ---------- Poster view ---------- */
.phead{padding:16px 22px 2px}
.phead-title{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--text);line-height:1.3}
.phead-meta{font-size:12.5px;color:var(--text-3);margin-top:4px}
.ptoolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px 2px}
.ptracks{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.ptracks .chip{padding:5px 10px;font-size:12px}
.seg.pseg{margin-left:auto}
.pgroup-h{position:sticky;top:57px;z-index:9;display:flex;align-items:baseline;gap:10px;padding:10px 2px 6px;margin-top:12px;background:linear-gradient(var(--bg) 65%,rgba(255,255,255,0))}
.pgroup-h .d{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em;display:flex;align-items:center}
.pgroup-h .n{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.poster{position:relative;border:1px solid var(--border);border-radius:9px;background:var(--panel);margin-bottom:6px;padding:11px 12px 11px 40px;transition:border-color .12s,background .12s}
.poster:hover{border-color:var(--border-2)}
.poster.exp{background:var(--bg-1);border-color:var(--border-2)}
.poster .star{position:absolute;left:6px;top:9px}
.poster .star svg{width:16px;height:16px}
.poster-main{cursor:pointer}
.poster-title{font-size:13.5px;font-weight:500;color:var(--text);line-height:1.42;letter-spacing:-.005em}
.poster-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:5px}
.poster-pres{font-size:12px;color:var(--text-3)}
.poster-ctx{font-size:11.5px;color:var(--text-3);margin-bottom:3px}
.poster-ctx .board{color:var(--text);font-weight:600}
.ptag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--text-2);background:var(--bg-2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;white-space:nowrap}
.ptag .dot{width:7px;height:7px;border-radius:2px;flex:none}
.poster-abs{display:none;font-size:12.5px;color:var(--text-2);line-height:1.6;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.poster.exp .poster-abs{display:block}
.poster-abs p{margin:0 0 8px}
.poster-abs a{color:var(--accent);word-break:break-word}
body.posters-view .daybar{padding-top:0}
.phead-note{font-size:11.5px;color:var(--text-3);margin-top:8px;background:var(--bg-2);border:1px solid var(--border);border-radius:7px;padding:6px 10px}

/* abstract / author captions + presentation stars */
.abs-cap{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
.pres{display:flex;gap:9px;align-items:flex-start}
.pres-body{flex:1;min-width:0}
.pres-star{flex:none;padding:3px;margin:-1px 0 0 0}
.pres-star svg{width:15px;height:15px}

/* ---------- Calendar view ---------- */
body.calendar-view .list{padding:0}
.cal-stack{padding:6px 22px 60px;max-width:1080px}
.cal-day{margin-bottom:14px}
.cal-day-h{position:sticky;top:57px;z-index:6;display:flex;align-items:baseline;gap:10px;padding:8px 2px 8px;background:linear-gradient(var(--bg) 68%,rgba(255,255,255,0))}
.cal-day-h .d{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.cal-day-h .n{font-size:12px;color:var(--text-3)}
.cal-day-grid{display:flex}
.cal-gutter{flex:none;width:52px;position:relative}
.cal-hour{position:absolute;right:9px;transform:translateY(-50%);font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.cal-daybody{position:relative;flex:1;min-width:0;border-left:1px solid var(--border)}
.cal-line{position:absolute;left:0;right:0;height:1px;background:var(--border)}
.cal-ev{position:absolute;border:1px solid var(--border-2);border-left:3px solid var(--accent);border-radius:6px;background:var(--panel);padding:4px 7px;overflow:hidden;box-shadow:0 1px 2px rgba(20,21,26,.05);cursor:pointer;transition:box-shadow .12s,transform .06s}
.cal-ev:hover{box-shadow:0 2px 8px rgba(20,21,26,.12);z-index:2}
.cal-ev:active{transform:translateY(1px)}
.cal-ev::before{content:"";position:absolute;inset:0;background:var(--evc);opacity:.07;pointer-events:none}
.cal-ev-time{font-size:10px;color:var(--text-3);font-weight:500;position:relative}
.cal-ev-title{font-size:11.5px;color:var(--text);font-weight:500;line-height:1.25;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;position:relative}
.cal-ev-room{font-size:10px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.cal-star{position:absolute;top:1px;right:1px;padding:2px;opacity:0;background:var(--panel);border-radius:5px}
.cal-ev:hover .cal-star{opacity:1}
.cal-star svg{width:13px;height:13px}
.cal-ev.short{padding:3px 7px}
.cal-ev.short .cal-ev-time{display:none}
.cal-ev.short .cal-ev-title{-webkit-line-clamp:1;margin-top:0}
.agenda-row{display:flex;gap:7px;align-items:flex-start;padding:5px 8px;border-radius:7px}
.agenda-row:hover{background:var(--bg-2)}
.agenda-row .star{padding:2px;margin-top:1px;flex:none}
.agenda-row .star svg{width:14px;height:14px}
.agenda-b{min-width:0}
.agenda-t{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.agenda-title{font-size:12px;color:var(--text);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#clearSched{margin:4px 8px 0}

/* mobile */
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:60;width:280px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.show{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}
  .scrim.show{display:block}
  .menu-btn{display:grid;place-items:center;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);width:34px;height:34px;border-radius:8px;flex:none}
  .search .kbd{display:none}
  .card-row{grid-template-columns:70px 1fr auto;gap:10px}
  .list,.daybar,.topbar{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">AS</div>
      <div>
        <h1>ASHG 2026</h1>
        <div class="sub">Montréal · Oct 18–24</div>
      </div>
    </div>
    <div class="viewswitch">
      <button data-view="program" class="on">Program</button>
      <button data-view="posters">Posters</button>
      <button data-view="calendar">Calendar</button>
    </div>
    <div id="filters"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Filters">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="text" placeholder="Search sessions, speakers, abstracts…" autocomplete="off" spellcheck="false" />
        <span class="kbd">/</span>
      </div>
      <div class="count" id="count"></div>
    </div>

    <div class="daybar" id="daybar"></div>
    <div class="list" id="list"><div class="loading">Loading program…</div></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var D = window.ASHG_DATA;
  if(!D){document.getElementById('list').innerHTML='<div class="empty"><h3>Could not load data</h3><p>data.js is missing.</p></div>';return;}

  // ---- track colors ----
  var TRACK_COLORS = ['#7c85f3','#e2607a','#4cc4a0','#e6a94c','#b06ab3','#5aa9e6','#e07a5f','#8bc34a','#c56cf0','#4db6ac','#f06292','#9575cd','#64b5f6','#ffb74d'];
  var trackColor = {};
  D.tracks.forEach(function(t,i){trackColor[t]=TRACK_COLORS[i%TRACK_COLORS.length];});

  var TYPE_COLORS = {
    'Plenary Sessions':'#e2607a','Platform Sessions':'#7c85f3','Poster Presentations':'#4cc4a0',
    'Featured Symposia':'#c56cf0','Workshops and Courses':'#e6a94c','Lightning Talks':'#5aa9e6',
    'Industry Events':'#8a8f98','Ancillary Events':'#8a8f98','Networking and Social Events':'#e07a5f',
    'Professional Education Sessions':'#64b5f6'
  };
  function typeColor(t){return TYPE_COLORS[t]||'#8a8f98';}

  // ---- state ----
  var state={view:'program',q:'',days:new Set(),
             types:new Set(['Featured Symposia','Platform Sessions','Plenary Sessions']),
             tracks:new Set(),rooms:new Set(),starOnly:false,
             pSession:null,pTracks:new Set(),pSort:'track'};
  var stars=new Set(JSON.parse(localStorage.getItem('ashg_stars')||'[]'));
  function saveStars(){localStorage.setItem('ashg_stars',JSON.stringify([].concat(Array.from(stars))));}
  var openCards=new Set();

  // ---- poster sessions ----
  var sessionIds=new Set(D.sessions.map(function(s){return s.id;}));
  var POSTERS=D.sessions.filter(function(s){return s.st.indexOf('Poster Presentations')>-1;});
  var posterById={};
  POSTERS.forEach(function(s){
    posterById[s.id]=s;
    (s.pr||[]).forEach(function(p){
      p._sess=s;
      var parts=[p.t].concat(p.tr||[]);
      (p.sp||[]).forEach(function(x){if(x)parts.push(x.n,x.a);});
      if(p.info)parts.push(strip(p.info));
      p._search=parts.join('  ').toLowerCase();
    });
  });
  if(POSTERS.length)state.pSession=POSTERS[0].id;
  var POSTERS_HAVE_BOARDS=POSTERS.some(function(s){return (s.pr||[]).some(function(p){return boardOf(p)!=null;});});
  function starredPosters(){var a=[];POSTERS.forEach(function(s){(s.pr||[]).forEach(function(p){if(stars.has(p.id))a.push(p);});});return a;}
  function countStarredSessions(){var n=0;stars.forEach(function(id){if(sessionIds.has(id))n++;});return n;}
  var openPosters=new Set();
  // link every presentation to its parent session + day (for the calendar view)
  var presById={};
  D.sessions.forEach(function(s){(s.pr||[]).forEach(function(p){p._sess=s;p._day=s.day;presById[p.id]=p;});});

  // ---- precompute search text ----
  D.sessions.forEach(function(s){
    var parts=[s.t,s.sub].concat(s.tr,s.st,s.rm);
    [].concat(s.sp,s.ch,s.mo).forEach(function(p){if(p)parts.push(p.n,p.a);});
    if(s.info)parts.push(strip(s.info));
    (s.pr||[]).forEach(function(p){
      parts.push(p.t);(p.sp||[]).forEach(function(x){if(x)parts.push(x.n,x.a);});
      if(p.info)parts.push(strip(p.info));
    });
    s._search=parts.join('  ').toLowerCase();
  });

  function strip(html){var d=document.createElement('div');d.innerHTML=html;return d.textContent||'';}
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  // ---- counts helper (respects OTHER active filters, faceted) ----
  function matches(s,ignore){
    if(state.starOnly && !stars.has(s.id))return false;
    if(ignore!=='q' && state.q){if(s._search.indexOf(state.q)===-1)return false;}
    if(ignore!=='days' && state.days.size && !state.days.has(s.day))return false;
    if(ignore!=='types' && state.types.size && !s.st.some(function(t){return state.types.has(t);}))return false;
    if(ignore!=='tracks' && state.tracks.size){
      if(state.tracks.has('__none__')){ if(s.tr.length && !s.tr.some(function(t){return state.tracks.has(t);}))return false; }
      else if(!s.tr.some(function(t){return state.tracks.has(t);}))return false;
    }
    if(ignore!=='rooms' && state.rooms.size && !s.rm.some(function(r){return state.rooms.has(r);}))return false;
    return true;
  }
  function facetCount(dim,val){
    var n=0;
    for(var i=0;i<D.sessions.length;i++){
      var s=D.sessions[i];
      if(!matches(s,dim))continue;
      if(dim==='days'&&s.day===val)n++;
      else if(dim==='types'&&s.st.indexOf(val)>-1)n++;
      else if(dim==='tracks'){ if(val==='__none__'){if(!s.tr.length)n++;} else if(s.tr.indexOf(val)>-1)n++; }
      else if(dim==='rooms'&&s.rm.indexOf(val)>-1)n++;
    }
    return n;
  }

  // ---- build sidebar ----
  var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>';
  var typeCounts={},roomCounts={},noTrackCount=0;
  D.sessions.forEach(function(s){
    s.st.forEach(function(t){typeCounts[t]=(typeCounts[t]||0)+1;});
    s.rm.forEach(function(r){roomCounts[r]=(roomCounts[r]||0)+1;});
    if(!s.tr.length)noTrackCount++;
  });

  function buildFilters(){
    var h='';
    // reset
    h+='<div style="padding:10px 12px 4px"><button class="side-reset" id="resetBtn" disabled>'+
       '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v6h6"/><path d="M3.5 8a9 9 0 1 0 2.3-3.5L3 8"/></svg>'+
       'Reset all filters</button></div>';
    // My schedule
    h+='<div class="side-sec"><div class="opt" id="starToggle" data-toggle="star">'+
       '<span class="box">'+CHECK+'</span><span class="lbl" style="color:var(--star);font-weight:500">★ My Schedule</span>'+
       '<span class="n" id="starCount">'+stars.size+'</span></div></div>';
    // Session type
    h+=group('Session type','types',D.sessionTypes.map(function(t){return{v:t,label:t,color:typeColor(t)};}));
    // Track
    var tr=D.tracks.map(function(t){return{v:t,label:t,color:trackColor[t]};});
    tr.push({v:'__none__',label:'No track assigned',color:'#3a3b40'});
    h+=group('Track','tracks',tr);
    // Room
    h+=group('Room','rooms',D.rooms.map(function(r){return{v:r,label:r};}));
    document.getElementById('filters').innerHTML=h;
  }
  function group(title,dim,items){
    var h='<div class="side-sec" data-sec="'+dim+'"><div class="side-head"><span>'+title+'</span>'+
      '<button class="clr" data-clear="'+dim+'">Clear</button></div>';
    items.forEach(function(it){
      h+='<div class="opt" data-dim="'+dim+'" data-val="'+esc(it.v)+'">'+
         '<span class="box">'+CHECK+'</span>'+
         (it.color?'<span class="dot" style="background:'+it.color+'"></span>':'')+
         '<span class="lbl">'+esc(it.label)+'</span>'+
         '<span class="n" data-count>0</span></div>';
    });
    return h+'</div>';
  }

  // ---- day bar ----
  function buildDayBar(){
    var h='';
    D.days.forEach(function(d){
      h+='<button class="chip" data-day="'+d.d+'">'+d.l+'<span class="c" data-daycount="'+d.d+'"></span></button>';
    });
    h+='<div class="seg"><button data-exp="0" class="on">Collapse</button><button data-exp="1">Expand all</button></div>';
    document.getElementById('daybar').innerHTML=h;
  }

  // ---- render dispatcher ----
  function render(){
    if(state.view==='posters')renderPosters();
    else if(state.view==='calendar')renderCalendar();
    else renderProgram();
  }

  // ---- render program list ----
  function renderProgram(){
    var filtered=D.sessions.filter(function(s){return matches(s,null);});
    // group by day
    var groups={},order=[];
    filtered.forEach(function(s){
      if(!groups[s.day]){groups[s.day]=[];order.push(s.day);}
      groups[s.day].push(s);
    });
    var html='';
    if(!filtered.length){
      html='<div class="empty"><h3>No sessions match</h3><p>Try removing a filter or clearing the search.</p></div>';
    }
    order.forEach(function(day){
      var arr=groups[day];var dl=arr[0].dl;
      html+='<div class="daygroup"><div class="daygroup-h"><span class="d">'+dl+'</span><span class="n">'+arr.length+' session'+(arr.length>1?'s':'')+'</span></div>';
      arr.forEach(function(s,i){
        if(i>0 && s.t1!==arr[i-1].t1)html+='<div class="timedivider"></div>';
        html+=cardHTML(s);
      });
      html+='</div>';
    });
    var list=document.getElementById('list');
    list.innerHTML=html;
    // counts
    document.getElementById('count').textContent=filtered.length+' of '+D.sessions.length+' sessions';
    updateFacetCounts();
  }

  // ================= POSTER VIEW =================
  function buildPosterNav(){
    var picks=starredPosters().length;
    var h='<div class="side-sec"><div class="opt pnav'+(state.pSession==='__picks__'?' on':'')+'" data-psession="__picks__">'+
          '<span class="lbl" style="color:var(--star);font-weight:500">★ My poster picks</span>'+
          '<span class="n">'+picks+'</span></div></div>';
    // group poster sessions by day
    var byDay={},order=[];
    POSTERS.forEach(function(s){if(!byDay[s.day]){byDay[s.day]=[];order.push(s.day);}byDay[s.day].push(s);});
    order.forEach(function(day){
      var arr=byDay[day];
      h+='<div class="side-sec"><div class="side-head"><span>'+esc(arr[0].dl)+'</span></div>';
      arr.forEach(function(s){
        h+='<div class="opt pnav'+(state.pSession===s.id?' on':'')+'" data-psession="'+s.id+'" title="'+esc(s.t)+'">'+
           '<span class="lbl">'+esc(shortPoster(s.t))+'</span>'+
           '<span class="n">'+(s.pr||[]).length+'</span></div>';
      });
      h+='</div>';
    });
    document.getElementById('filters').innerHTML=h;
  }
  function shortPoster(t){return t.replace(/\s*Poster\s+(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)?\s*Session\s*/i,'').trim()||t;}

  function currentPosters(){
    if(state.pSession==='__picks__')return starredPosters();
    var s=posterById[state.pSession];return s?(s.pr||[]):[];
  }
  function posterMatch(p){
    if(state.q && p._search.indexOf(state.q)===-1)return false;
    if(state.pTracks.size && !(p.tr||[]).some(function(t){return state.pTracks.has(t);}))return false;
    return true;
  }

  function renderPosters(){
    var isPicks=state.pSession==='__picks__';
    var all=currentPosters();
    // toolbar
    var tracksInSet={};
    all.forEach(function(p){(p.tr||[]).forEach(function(t){tracksInSet[t]=(tracksInSet[t]||0)+1;});});
    var trackList=Object.keys(tracksInSet).sort();
    var head='';
    if(isPicks){
      head='<div class="phead"><div class="phead-title">★ My poster picks</div>'+
           '<div class="phead-meta">'+all.length+' poster'+(all.length!==1?'s':'')+' saved · sorted by day, time'+(POSTERS_HAVE_BOARDS?', board number':'')+'</div>'+
           (all.length&&!POSTERS_HAVE_BOARDS?'<div class="phead-note">Poster board numbers aren’t published yet — they’ll appear here once ASHG releases them.</div>':'')+'</div>';
    }else{
      var s=posterById[state.pSession];
      head='<div class="phead"><div class="phead-title">'+esc(s?s.t:'')+'</div>'+
           '<div class="phead-meta">'+(s?esc(s.dl+' · '+s.t1+'–'+s.t2+' · '+s.rm.join(', ')):'')+' · '+all.length+' posters</div>'+
           '<div class="phead-note">Abstracts are embargoed until the meeting — expand a poster for its full author list.</div></div>';
    }
    // track chips
    var chips='';
    if(trackList.length>1){
      chips='<div class="ptracks">';
      trackList.forEach(function(t){
        chips+='<button class="chip'+(state.pTracks.has(t)?' on':'')+'" data-ptrack="'+esc(t)+'">'+
               '<span class="dot" style="width:7px;height:7px;border-radius:2px;background:'+(trackColor[t]||'#8b8d96')+'"></span>'+
               esc(t)+'<span class="c">'+tracksInSet[t]+'</span></button>';
      });
      chips+='</div>';
    }
    var sortSeg=isPicks?'':'<div class="seg pseg">'+
      '<button data-psort="track"'+(state.pSort==='track'?' class="on"':'')+'>By track</button>'+
      '<button data-psort="az"'+(state.pSort==='az'?' class="on"':'')+'>A–Z</button>'+
      '<button data-psort="pres"'+(state.pSort==='pres'?' class="on"':'')+'>Presenter</button></div>';
    document.getElementById('daybar').innerHTML=head+'<div class="ptoolbar">'+chips+sortSeg+'</div>';

    // filter
    var filtered=all.filter(posterMatch);
    var scoped=(state.q||state.pTracks.size);
    var govern=scoped?all.length:filtered.length;
    document.getElementById('count').textContent=filtered.length+(scoped?(' of '+all.length):'')+' poster'+(govern!==1?'s':'');

    // sort/group
    var html='';
    if(!POSTERS.length){html='<div class="empty"><h3>No poster sessions</h3></div>';}
    else if(isPicks && !all.length){html='<div class="empty"><h3>No posters saved yet</h3><p>Open a poster session and tap the star on posters you want to visit. They’ll collect here.</p></div>';}
    else if(!filtered.length){html='<div class="empty"><h3>No posters match</h3><p>Try a different search or clear the track filter.</p></div>';}
    else if(isPicks){
      // flat list sorted by day -> time -> board number -> title, grouped by day
      var arr=filtered.slice().sort(byDayTimeBoard);
      var byDay={},order=[];
      arr.forEach(function(p){var d=p._sess.day;if(!byDay[d]){byDay[d]=[];order.push(d);}byDay[d].push(p);});
      order.forEach(function(d){
        var g=byDay[d];
        html+='<div class="pgroup-h"><span class="d">'+esc(g[0]._sess.dl)+'</span><span class="n">'+g.length+' poster'+(g.length!==1?'s':'')+'</span></div>';
        g.forEach(function(p){
          var board=boardOf(p);
          var ctx=(board!=null?'<b class="board">Board '+board+'</b> · ':'')+esc(p._sess.t1)+' · '+esc(shortPoster(p._sess.t));
          html+=posterHTML(p,ctx);
        });
      });
    }
    else if(state.pSort==='track'){
      var byT={};filtered.forEach(function(p){var t=(p.tr&&p.tr[0])||'Other';(byT[t]=byT[t]||[]).push(p);});
      Object.keys(byT).sort().forEach(function(t){
        var arr=byT[t].sort(byTitle);
        html+='<div class="pgroup-h"><span class="d"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+(trackColor[t]||'#8b8d96')+';margin-right:7px"></span>'+esc(t)+'</span><span class="n">'+arr.length+'</span></div>';
        arr.forEach(function(p){html+=posterHTML(p);});
      });
    }else{
      var sorted=filtered.slice().sort(state.pSort==='pres'?byPresenter:byTitle);
      sorted.forEach(function(p){html+=posterHTML(p);});
    }
    document.getElementById('list').innerHTML=html;
    // update poster nav active + picks count
    document.querySelectorAll('.pnav').forEach(function(el){el.classList.toggle('on',el.getAttribute('data-psession')===state.pSession);});
    var pk=document.querySelector('.pnav[data-psession="__picks__"] .n');if(pk)pk.textContent=starredPosters().length;
  }
  function byTitle(a,b){return (a.t||'').localeCompare(b.t||'');}
  function byPresenter(a,b){var an=(a.sp&&a.sp[0]&&a.sp[0].n)||'zzz',bn=(b.sp&&b.sp[0]&&b.sp[0].n)||'zzz';return an.localeCompare(bn);}
  // poster board number — not published by ASHG yet; future-proofed if it appears in the data
  function boardOf(p){var b=(p.board!=null?p.board:null);if(b==null)return null;var n=parseInt(b,10);return isNaN(n)?null:n;}
  function byDayTimeBoard(a,b){
    var ad=(a._sess.day||''),bd=(b._sess.day||'');if(ad!==bd)return ad<bd?-1:1;
    var at=(a.sk||a._sess.sk||''),bt=(b.sk||b._sess.sk||'');if(at!==bt)return at<bt?-1:1;
    var ab=boardOf(a),bb=boardOf(b);
    if(ab!=null&&bb!=null&&ab!==bb)return ab-bb;
    if(ab!=null&&bb==null)return -1;if(ab==null&&bb!=null)return 1;
    return (a.t||'').localeCompare(b.t||'');
  }

  function posterHTML(p,ctx){
    var open=openPosters.has(p.id);
    var pres=(p.sp||[]).map(function(x){return x.n+(x.a?' · '+x.a:'');}).join('; ');
    var track=(p.tr&&p.tr[0])?'<span class="ptag"><span class="dot" style="background:'+(trackColor[p.tr[0]]||'#8b8d96')+'"></span>'+esc(p.tr[0])+'</span>':'';
    var ib=infoBlock(p.info);
    var body=ib?'<div class="poster-abs"><div class="abs-cap">'+(ib.kind==='authors'?'Full author list':'Abstract')+'</div>'+ib.html+'</div>':'';
    return '<div class="poster'+(open?' exp':'')+'" data-pid="'+p.id+'">'+
      '<button class="star'+(stars.has(p.id)?' on':'')+'" data-star="'+p.id+'" title="Save poster">'+(stars.has(p.id)?ICON.starFill:ICON.star)+'</button>'+
      '<div class="poster-main js-ptoggle">'+
        (ctx?'<div class="poster-ctx">'+ctx+'</div>':'')+
        '<div class="poster-title">'+esc(p.t)+'</div>'+
        '<div class="poster-meta">'+(pres?'<span class="poster-pres">'+esc(pres)+'</span>':'')+track+'</div>'+
        body+
      '</div>'+
    '</div>';
  }

  // ---- view switching ----
  function setView(v){
    state.view=v;
    document.querySelectorAll('.viewswitch button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-view')===v);});
    var qEl=document.getElementById('q');
    document.body.classList.toggle('posters-view',v==='posters');
    document.body.classList.toggle('calendar-view',v==='calendar');
    if(v==='posters'){
      qEl.placeholder='Search posters in this session…';
      buildPosterNav();
    }else if(v==='calendar'){
      qEl.placeholder='Search sessions, speakers, abstracts…';
      buildCalendarNav();
    }else{
      qEl.placeholder='Search sessions, speakers, abstracts…';
      buildFilters();
      buildDayBar();
    }
    // reset scoped query so it doesn't carry confusingly between views
    state.q='';qEl.value='';
    render();
  }

  // ================= CALENDAR VIEW =================
  function locMin(iso){ // -> [ymd, minutesFromMidnight] in Montreal time (UTC-4)
    if(!iso)return null;
    var d=new Date(new Date(iso).getTime()-4*3600*1000);
    var ymd=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
    return [ymd, d.getUTCHours()*60+d.getUTCMinutes()];
  }
  function pad(n){return n<10?'0'+n:''+n;}
  function calColor(it){
    if(it.kind==='session')return typeColor(it.ref.st[0]);
    var tr=(it.ref.tr&&it.ref.tr[0]);
    return tr?(trackColor[tr]||'var(--accent)'):'var(--accent)';
  }
  function scheduleItems(){
    var items=[];
    D.sessions.forEach(function(s){
      if(stars.has(s.id)){
        var a=locMin(s.s),b=locMin(s.e);
        if(a)items.push({id:s.id,kind:'session',title:s.t,sub:'',room:s.rm.join(', '),
          day:a[0],dl:s.dl,startMin:a[1],endMin:b?b[1]:a[1]+60,ref:s});
      }
      // posters live in "My poster picks", not the calendar
      if(s.st.indexOf('Poster Presentations')>-1)return;
      (s.pr||[]).forEach(function(p){
        if(stars.has(p.id)){
          var a=locMin(p.s),b=locMin(p.e);
          if(a)items.push({id:p.id,kind:'talk',
            title:p.t,sub:s.t,room:(p.rm&&p.rm.length?p.rm.join(', '):s.rm.join(', ')),
            day:a[0],dl:s.dl,startMin:a[1],endMin:b?b[1]:a[1]+30,ref:p});
        }
      });
    });
    return items;
  }

  function buildCalendarNav(){
    var items=scheduleItems();
    var h='<div class="side-sec"><div class="opt" style="cursor:default">'+
          '<span class="lbl" style="color:var(--star);font-weight:600">★ My Schedule</span>'+
          '<span class="n">'+items.length+'</span></div>';
    if(items.length)h+='<button class="side-reset" id="clearSched" style="margin-top:2px">Clear all</button>';
    h+='</div>';
    // agenda grouped by day
    var byDay={},order=[];
    items.slice().sort(function(a,b){return (a.day+pad2(a.startMin)).localeCompare(b.day+pad2(b.startMin));}).forEach(function(it){
      if(!byDay[it.day]){byDay[it.day]=[];order.push(it.day);}byDay[it.day].push(it);
    });
    order.forEach(function(day){
      h+='<div class="side-sec"><div class="side-head"><span>'+esc(byDay[day][0].dl)+'</span></div>';
      byDay[day].forEach(function(it){
        h+='<div class="agenda-row"><button class="star on" data-star="'+it.id+'" title="Remove">'+ICON.starFill+'</button>'+
           '<div class="agenda-b"><div class="agenda-t">'+esc(fmtMin(it.startMin))+'</div>'+
           '<div class="agenda-title">'+esc(it.title)+'</div></div></div>';
      });
      h+='</div>';
    });
    document.getElementById('filters').innerHTML=h;
  }
  function pad2(n){n=Math.round(n);return (n<1000?'000'+n:''+n).slice(-4);}
  function fmtMin(m){var h=Math.floor(m/60),mm=m%60;var ap=h<12?'AM':'PM';var hh=h%12||12;return hh+':'+pad(mm)+' '+ap;}

  function renderCalendar(){
    var items=scheduleItems();
    if(state.q){items=items.filter(function(it){return (it.title+' '+it.sub+' '+it.room).toLowerCase().indexOf(state.q)>-1;});}
    document.getElementById('daybar').innerHTML='<div class="phead"><div class="phead-title">My Schedule</div>'+
      '<div class="phead-meta">'+items.length+' starred item'+(items.length!==1?'s':'')+' · sessions &amp; talks you’ve saved (posters live in My poster picks)</div></div>';
    document.getElementById('count').textContent=items.length+' item'+(items.length!==1?'s':'');
    var list=document.getElementById('list');
    if(!items.length){
      list.innerHTML='<div class="empty"><h3>Your schedule is empty</h3><p>Tap the ☆ on any session or presentation and it will appear here laid out by day and time — so you can spot overlaps at a glance. (Starred posters go to <b>My poster picks</b>.)</p></div>';
      return;
    }
    // group by day, then render each day full-width, stacked vertically
    var byDay={},order=[];
    items.forEach(function(it){if(!byDay[it.day]){byDay[it.day]=[];order.push(it.day);}byDay[it.day].push(it);});
    order.sort();
    var PX=0.95;
    var html='<div class="cal-stack">';
    order.forEach(function(day){
      var arr=byDay[day].slice().sort(function(a,b){return a.startMin-b.startMin || a.endMin-b.endMin;});
      // per-day time range so each day is only as tall as it needs
      var minM=1440,maxM=0;
      arr.forEach(function(it){minM=Math.min(minM,it.startMin);maxM=Math.max(maxM,it.endMin);});
      minM=Math.floor(minM/60)*60; maxM=Math.ceil(maxM/60)*60;
      if(maxM-minM<120)maxM=minM+120;
      var H=(maxM-minM)*PX;
      // lane packing for overlaps within the day
      var laneEnd=[];
      arr.forEach(function(it){
        var lane=-1;
        for(var i=0;i<laneEnd.length;i++){if(it.startMin>=laneEnd[i]){lane=i;break;}}
        if(lane===-1){lane=laneEnd.length;laneEnd.push(0);}
        it._lane=lane;laneEnd[lane]=it.endMin;
      });
      var lanes=laneEnd.length;
      var gutter='',lines='';
      for(var m=minM;m<=maxM;m+=60){
        gutter+='<div class="cal-hour" style="top:'+((m-minM)*PX)+'px">'+fmtMin(m).replace(':00','')+'</div>';
        lines+='<div class="cal-line" style="top:'+((m-minM)*PX)+'px"></div>';
      }
      var blocks='';
      arr.forEach(function(it){
        var top=(it.startMin-minM)*PX, hgt=Math.max((it.endMin-it.startMin)*PX,24);
        var w=100/lanes, left=it._lane*w;
        var c=calColor(it);
        var kindLbl=it.kind==='poster'?'Poster':(it.kind==='talk'?'Talk':'');
        blocks+='<div class="cal-ev k-'+it.kind+(hgt<40?' short':'')+'" style="top:'+top+'px;height:'+hgt+'px;left:calc('+left+'% + 2px);width:calc('+w+'% - 4px);border-left-color:'+c+';--evc:'+c+'" title="'+esc(it.title+' · '+fmtMin(it.startMin)+'–'+fmtMin(it.endMin)+(it.room?' · '+it.room:''))+'" data-evid="'+it.id+'">'+
          '<button class="star on cal-star" data-star="'+it.id+'" title="Remove">'+ICON.starFill+'</button>'+
          '<div class="cal-ev-time">'+esc(fmtMin(it.startMin))+'–'+esc(fmtMin(it.endMin))+(kindLbl?' · '+kindLbl:'')+'</div>'+
          '<div class="cal-ev-title">'+esc(it.title)+'</div>'+
          (it.room&&hgt>58?'<div class="cal-ev-room">'+esc(it.room)+'</div>':'')+
        '</div>';
      });
      html+='<div class="cal-day"><div class="cal-day-h"><span class="d">'+esc(byDay[day][0].dl)+'</span><span class="n">'+arr.length+' item'+(arr.length!==1?'s':'')+'</span></div>'+
            '<div class="cal-day-grid"><div class="cal-gutter" style="height:'+H+'px">'+gutter+'</div>'+
            '<div class="cal-daybody" style="height:'+H+'px">'+lines+blocks+'</div></div></div>';
    });
    html+='</div>';
    list.innerHTML=html;
  }

  function flashEl(el,block){
    if(!el)return;
    el.scrollIntoView({behavior:'smooth',block:block||'center'});
    el.classList.add('flash');
    setTimeout(function(){el.classList.remove('flash');},1500);
  }

  // jump from a calendar block to the item's detail in Program / Posters
  function goToItem(id){
    if(sessionIds.has(id)){openSessionInProgram(id,null);return;}
    var p=presById[id];if(!p)return;
    var s=p._sess;
    if(s.st.indexOf('Poster Presentations')>-1){
      state.pSession=s.id;state.pTracks.clear();openPosters.add(id);
      setView('posters'); // renders synchronously
      flashEl(document.querySelector('.poster[data-pid="'+id+'"]'),'center');
    }else{
      openSessionInProgram(s.id,id);
    }
  }
  function openSessionInProgram(sid,presId){
    // clear filters so the target session is guaranteed visible
    state.types.clear();state.tracks.clear();state.rooms.clear();state.days.clear();state.starOnly=false;
    openCards.add(sid);
    setView('program'); // renders synchronously
    var card=document.querySelector('.card[data-id="'+sid+'"]');
    if(!card)return;
    if(presId){
      var target=[].filter.call(card.querySelectorAll('.pres'),function(pr){var st=pr.querySelector('[data-star]');return st&&st.getAttribute('data-star')===presId;})[0];
      if(target){
        if(!target.classList.contains('exp')){var more=target.querySelector('.js-absmore');if(more){target.classList.add('exp');more.textContent='Hide '+(more.getAttribute('data-label')||'abstract');}}
        flashEl(target,'center');return;
      }
    }
    flashEl(card,'start');
  }

  function cardHTML(s){
    var open=openCards.has(s.id);
    var tc=typeColor(s.st[0]);
    var typeBadge=s.st.length?'<span class="badge type"><span class="dot" style="background:'+tc+'"></span>'+esc(s.st[0])+'</span>':'';
    var trackTags=s.tr.map(function(t){return '<span class="tag"><span class="dot" style="width:7px;height:7px;border-radius:2px;background:'+(trackColor[t]||'#666')+'"></span>'+esc(t)+'</span>';}).join('');
    var room=s.rm.length?'<span class="tag room">'+ICON.pin+esc(s.rm.join(', '))+'</span>':'';
    var sub=s.sub&&!s.st.length?'<span class="badge type">'+esc(s.sub)+'</span>':'';
    // people summary
    var lead=[];
    if(s.ch.length)lead.push('<b>'+esc(s.ch.map(nm).join(', '))+'</b>');
    var people='';
    var chairs=s.ch.length?'<b>Chairs:</b> '+esc(s.ch.map(nm).join(', ')):'';
    var speakers=s.sp.length?'<b>Speakers:</b> '+esc(shorten(s.sp)):'';
    var mods=s.mo.length?'<b>Moderators:</b> '+esc(s.mo.map(nm).join(', ')):'';
    var pl=[chairs,mods,speakers].filter(Boolean).slice(0,2).join(' &nbsp;·&nbsp; ');
    if(pl)people='<div class="people">'+pl+'</div>';
    return '<div class="card'+(open?' open':'')+'" data-id="'+s.id+'">'+
      '<div class="card-row js-toggle">'+
        '<div class="time"><span class="t1">'+esc(s.t1)+'</span><span class="t2">'+(s.dur?esc(s.dur):esc(s.t2))+'</span></div>'+
        '<div class="body">'+
          '<div class="title">'+esc(s.t)+'</div>'+
          '<div class="meta">'+typeBadge+sub+trackTags+room+'</div>'+
          people+
        '</div>'+
        '<div class="card-side">'+
          '<button class="star'+(stars.has(s.id)?' on':'')+'" data-star="'+s.id+'" title="Add to My Schedule">'+(stars.has(s.id)?ICON.starFill:ICON.star)+'</button>'+
          '<span class="chev">'+ICON.chev+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="detail">'+(open?detailHTML(s):'')+'</div>'+
    '</div>';
  }
  function nm(p){return p.n;}
  function shorten(arr){var names=arr.map(nm);if(names.length>4)return names.slice(0,4).join(', ')+' +'+(names.length-4)+' more';return names.join(', ');}

  // strip the "Learning Objectives" and "CEU Credits" sections from a session description
  function cleanSessionInfo(html){
    if(!html)return '';
    var idx=-1;
    [/Learning Objectives/i,/CEU Credits/i].forEach(function(re){
      var m=html.search(re);
      if(m>-1 && (idx===-1||m<idx))idx=m;
    });
    if(idx>-1)html=html.slice(0,idx);
    // drop a now-dangling empty tag tail
    return html.replace(/(<(p|b|strong|br|ul|ol|li)\s*\/?>\s*)+$/i,'');
  }

  function detailHTML(s){
    var h='';
    var info=cleanSessionInfo(s.info);
    if(strip(info).trim())h+='<div class="info">'+sanitize(info)+'</div>';
    if(s.pr&&s.pr.length){
      h+='<div class="subheat">'+s.pr.length+' Presentation'+(s.pr.length>1?'s':'')+'</div>';
      s.pr.forEach(function(p,i){
        var pres=(p.sp||[]).map(function(x){return x.n+(x.a?' ('+x.a+')':'');});
        var tline=(p.t1?p.t1:'')+(p.t2?' – '+p.t2:'');
        var ib=infoBlock(p.info);
        var lbl=ib?(ib.kind==='authors'?'authors':'abstract'):'';
        var cap=ib?(ib.kind==='authors'?'Full author list':'Abstract'):'';
        h+='<div class="pres" data-pres="'+i+'">'+
             '<button class="star pres-star'+(stars.has(p.id)?' on':'')+'" data-star="'+p.id+'" title="Add to My Schedule">'+(stars.has(p.id)?ICON.starFill:ICON.star)+'</button>'+
             '<div class="pres-body">'+
               '<div class="pres-t"><span class="pres-time">'+esc(tline)+'</span>'+
               '<span class="pres-title">'+esc(p.t)+'</span></div>'+
               (pres.length?'<div class="pres-people">'+esc(pres.join('; '))+'</div>':'')+
               (ib?'<div class="pres-abs"><div class="abs-cap">'+cap+'</div>'+ib.html+'</div><span class="pres-more js-absmore" data-label="'+lbl+'">Show '+lbl+'</span>':'')+
             '</div>'+
           '</div>';
      });
    }
    return h;
  }

  // very small allowlist sanitizer for the CMS html (a,p,b,strong,i,em,ul,ol,li,br)
  function sanitize(html){
    var d=document.createElement('div');d.innerHTML=html;
    (function walk(node){
      var kids=[].slice.call(node.childNodes);
      kids.forEach(function(c){
        if(c.nodeType===1){
          var tag=c.tagName.toLowerCase();
          if(['script','style','iframe','img','svg','object'].indexOf(tag)>-1){c.remove();return;}
          [].slice.call(c.attributes).forEach(function(a){
            if(tag==='a'&&(a.name==='href')){
              if(/^https?:/i.test(c.getAttribute('href')||'')){c.setAttribute('target','_blank');c.setAttribute('rel','noopener noreferrer');}
              else c.removeAttribute('href');
            } else c.removeAttribute(a.name);
          });
          walk(c);
        }
      });
    })(d);
    return d.innerHTML;
  }

  // Distinguish an "Author Block" (full author list, all that's public pre-meeting)
  // from a real abstract/description body. Returns {kind, html} or null.
  function infoBlock(html){
    if(!html)return null;
    var txt=strip(html).trim();
    if(!txt)return null;
    var isAuthors=/^author block/i.test(txt);
    var content=html;
    if(isAuthors){
      content=html.replace(/<b>\s*Author Block\s*<\/b>\s*(<br\s*\/?>)?/i,'');
    }
    return {kind:isAuthors?'authors':'abstract',html:sanitize(content)};
  }

  var ICON={
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
    chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
    starFill:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
  };

  // ---- update facet counts + active classes ----
  function updateFacetCounts(){
    document.querySelectorAll('.opt[data-dim]').forEach(function(el){
      var dim=el.getAttribute('data-dim'),val=el.getAttribute('data-val');
      var active=state[dim].has(val);
      el.classList.toggle('on',active);
      var n=facetCount(dim,val);
      var c=el.querySelector('[data-count]');
      if(c)c.textContent=n;
      el.style.display=(n===0&&!active)?'none':'';
    });
    // section active state
    document.querySelectorAll('.side-sec[data-sec]').forEach(function(sec){
      var dim=sec.getAttribute('data-sec');
      sec.classList.toggle('has-active',state[dim].size>0);
    });
    // day chips
    document.querySelectorAll('.chip[data-day]').forEach(function(el){
      var d=el.getAttribute('data-day');
      el.classList.toggle('on',state.days.has(d));
      var c=el.querySelector('[data-daycount]');
      if(c)c.textContent=facetCount('days',d);
    });
    // star toggle
    var stEl=document.getElementById('starToggle');if(stEl)stEl.classList.toggle('on',state.starOnly);
    var scEl=document.getElementById('starCount');if(scEl)scEl.textContent=countStarredSessions();
    // reset btn
    var any=state.q||state.days.size||state.types.size||state.tracks.size||state.rooms.size||state.starOnly;
    var rb=document.getElementById('resetBtn');if(rb)rb.disabled=!any;
  }

  // ---- events ----
  function toggleSet(set,val){if(set.has(val))set.delete(val);else set.add(val);}

  document.querySelector('.viewswitch').addEventListener('click',function(e){
    var b=e.target.closest('[data-view]');if(b)setView(b.getAttribute('data-view'));
  });

  document.getElementById('filters').addEventListener('click',function(e){
    // calendar agenda: remove item / clear all
    if(e.target.closest('#clearSched')){scheduleItems().forEach(function(it){stars.delete(it.id);});saveStars();buildCalendarNav();render();return;}
    if(state.view==='calendar'){
      var st=e.target.closest('[data-star]');
      if(st){toggleSet(stars,st.getAttribute('data-star'));saveStars();buildCalendarNav();render();return;}
    }
    // poster nav
    var pnav=e.target.closest('.pnav');
    if(pnav){state.pSession=pnav.getAttribute('data-psession');state.pTracks.clear();state.q='';document.getElementById('q').value='';render();return;}
    var opt=e.target.closest('.opt');
    var clr=e.target.closest('[data-clear]');
    var reset=e.target.closest('#resetBtn');
    if(reset){resetAll();return;}
    if(clr){var d=clr.getAttribute('data-clear');state[d].clear();render();return;}
    if(opt){
      if(opt.id==='starToggle'){state.starOnly=!state.starOnly;render();return;}
      var dim=opt.getAttribute('data-dim'),val=opt.getAttribute('data-val');
      toggleSet(state[dim],val);render();
    }
  });

  document.getElementById('daybar').addEventListener('click',function(e){
    // poster toolbar
    var ptrack=e.target.closest('[data-ptrack]');
    if(ptrack){toggleSet(state.pTracks,ptrack.getAttribute('data-ptrack'));render();return;}
    var psort=e.target.closest('[data-psort]');
    if(psort){state.pSort=psort.getAttribute('data-psort');render();return;}
    var chip=e.target.closest('.chip[data-day]');
    var exp=e.target.closest('[data-exp]');
    if(chip){toggleSet(state.days,chip.getAttribute('data-day'));render();}
    if(exp){
      var on=exp.getAttribute('data-exp')==='1';
      document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on');});exp.classList.add('on');
      if(on){D.sessions.forEach(function(s){if(matches(s,null))openCards.add(s.id);});}
      else openCards.clear();
      render();
    }
  });

  document.getElementById('list').addEventListener('click',function(e){
    var star=e.target.closest('[data-star]');
    if(star){
      e.stopPropagation();
      var id=star.getAttribute('data-star');
      toggleSet(stars,id);saveStars();
      star.classList.toggle('on',stars.has(id));
      star.innerHTML=stars.has(id)?ICON.starFill:ICON.star;
      if(state.view==='posters'){
        // if viewing picks, drop it; otherwise just refresh sidebar picks count
        var pk=document.querySelector('.pnav[data-psession="__picks__"] .n');if(pk)pk.textContent=starredPosters().length;
        if(state.pSession==='__picks__')render();
      }else if(state.view==='calendar'){
        buildCalendarNav();render();
      }else{
        var scEl=document.getElementById('starCount');if(scEl)scEl.textContent=countStarredSessions();
        if(state.starOnly)render();
      }
      return;
    }
    // calendar event -> jump to detail
    var ev=e.target.closest('.cal-ev');
    if(ev){goToItem(ev.getAttribute('data-evid'));return;}
    // poster row expand
    var ptog=e.target.closest('.js-ptoggle');
    if(ptog){var pc=ptog.closest('.poster');var pid=pc.getAttribute('data-pid');
      if(openPosters.has(pid))openPosters.delete(pid);else openPosters.add(pid);
      pc.classList.toggle('exp');return;}
    var more=e.target.closest('.js-absmore');
    if(more){var pres=more.closest('.pres');pres.classList.toggle('exp');var lb=more.getAttribute('data-label')||'abstract';more.textContent=(pres.classList.contains('exp')?'Hide ':'Show ')+lb;return;}
    var row=e.target.closest('.js-toggle');
    if(row){
      var card=row.closest('.card');var id=card.getAttribute('data-id');
      var s=D.sessions.find(function(x){return x.id===id;});
      if(openCards.has(id)){openCards.delete(id);card.classList.remove('open');card.querySelector('.detail').innerHTML='';}
      else{openCards.add(id);card.classList.add('open');card.querySelector('.detail').innerHTML=detailHTML(s);}
    }
  });

  var qEl=document.getElementById('q');
  var qt;
  qEl.addEventListener('input',function(){
    clearTimeout(qt);
    qt=setTimeout(function(){state.q=qEl.value.trim().toLowerCase();render();},130);
  });

  function resetAll(){
    state.q='';qEl.value='';state.days.clear();state.types.clear();state.tracks.clear();state.rooms.clear();state.starOnly=false;
    render();
  }

  // keyboard
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}
    if(e.key==='Escape'){if(document.activeElement===qEl){qEl.blur();}closeSidebar();}
  });

  // mobile sidebar
  function closeSidebar(){document.getElementById('sidebar').classList.remove('show');document.getElementById('scrim').classList.remove('show');}
  document.getElementById('menuBtn').addEventListener('click',function(){document.getElementById('sidebar').classList.add('show');document.getElementById('scrim').classList.add('show');});
  document.getElementById('scrim').addEventListener('click',closeSidebar);

  // ---- init ----
  buildFilters();
  buildDayBar();
  render();
})();
</script>
