<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASHG 2026 · Program Planner</title>
<meta name="description" content="An elegant, fast planner for the ASHG 2026 Annual Meeting program — filter sessions by day, track, type, and room." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600&family=Newsreader:opsz,wght@6..72,400..800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#ffffff;
  --bg-1:#fafaf9;
  --bg-2:#f3f3f1;
  --panel:#ffffff;
  --border:#ececea;
  --border-2:#dcdcd8;
  --text:#16171a;
  --text-2:#54565d;
  --text-3:#8d8f96;
  --accent:#4553c2;
  --accent-soft:rgba(69,83,194,.08);
  --star:#c58e0b;
  --serif:'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --top:61px;
}
.brand h1,.chip .dn,.daygroup-h .d,.empty h3,.phead-title,.cal-day-h .d{font-optical-sizing:auto;font-variation-settings:'opsz' 72
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:"cv11","ss01";
}
::selection{background:var(--accent-soft);color:var(--text)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;color:inherit}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#dededa;border-radius:6px;border:3px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:#c9c9c4}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{border-right:1px solid var(--border);background:var(--bg);position:sticky;top:0;height:100vh;overflow-y:auto;padding:0 0 32px}
.main{min-width:0;display:flex;flex-direction:column}
.scrim{display:none}

/* ---------- Brand + view nav ---------- */
.brand{padding:26px 22px 18px}
.brand h1{font-family:var(--serif);font-weight:800;font-size:27px;line-height:1;letter-spacing:-.025em;margin:0}
.brand .sub{font-size:12px;color:var(--text-3);margin-top:7px}
.viewswitch{display:flex;flex-direction:column;gap:1px;padding:0 12px 14px;border-bottom:1px solid var(--border)}
.viewswitch button{background:none;border:none;text-align:left;font-size:13.5px;color:var(--text-2);padding:7px 10px;border-radius:7px;transition:background .12s,color .12s}
.viewswitch button:hover{background:var(--bg-2);color:var(--text)}
.viewswitch button.on{background:var(--bg-2);color:var(--text);font-weight:500}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;height:var(--top);background:rgba(255,255,255,.88);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;gap:16px}
.search{position:relative;flex:1;max-width:460px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search input{width:100%;background:var(--bg-2);border:1px solid transparent;color:var(--text);border-radius:8px;padding:8px 34px 8px 34px;font-size:13.5px;font-family:inherit;outline:none;transition:background .12s,border-color .12s}
.search input:focus{background:var(--bg);border-color:var(--border-2)}
.search input::placeholder{color:var(--text-3)}
.search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-3);border:1px solid var(--border-2);border-radius:4px;padding:0 5px;line-height:16px;pointer-events:none;background:var(--bg)}
.topbar .count{margin-left:auto;color:var(--text-3);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- Sidebar filters ---------- */
.side-top{display:flex;align-items:baseline;justify-content:space-between;padding:20px 22px 2px}
.side-top span{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.side-reset{background:none;border:none;padding:0;font-size:12px;color:var(--text-3)}
.side-reset:hover{color:var(--text)}
.side-reset:disabled{visibility:hidden}
.side-sec{padding:4px 12px 6px}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 5px;color:var(--text-3);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.side-head .clr{color:var(--text-3);font-size:11.5px;text-transform:none;letter-spacing:0;font-weight:400;background:none;border:none;padding:0;visibility:hidden}
.side-head .clr:hover{color:var(--text)}
.side-sec.has-active .clr{visibility:visible}
.opt{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:6px;color:var(--text-2);font-size:13px;user-select:none;cursor:pointer;transition:background .1s,color .1s}
.opt:hover{background:var(--bg-2);color:var(--text)}
.opt .box{width:13px;height:13px;border-radius:3.5px;border:1px solid var(--border-2);flex:none;display:grid;place-items:center;transition:background .12s,border-color .12s;background:var(--bg)}
.opt .box svg{width:9px;height:9px;opacity:0;transition:opacity .12s}
.opt.on .box{background:var(--text);border-color:var(--text)}
.opt.on .box svg{opacity:1}
.opt.on{color:var(--text)}
.opt .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .n{color:var(--text-3);font-size:11.5px;font-variant-numeric:tabular-nums}
.opt .dot{display:none}
.opt.star-opt .lbl::before{content:"★";color:var(--star);margin-right:6px;font-size:12px}
.opt.pnav{padding:6px 10px}
.opt.pnav.on{background:var(--bg-2);color:var(--text)}
.opt.pnav.on .lbl{font-weight:500}

/* ---------- Day tabs ---------- */
.daybar{display:flex;align-items:flex-end;gap:2px;padding:18px 32px 0;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.chip{background:none;border:none;padding:6px 14px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-2);border-radius:0;box-shadow:inset 0 -2px 0 transparent;transition:color .12s,box-shadow .12s}
.chip .dw{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.chip .dn{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1;letter-spacing:-.02em;color:var(--text-2)}
.chip .c{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;min-height:13px}
.chip:hover .dn{color:var(--text)}
.chip.on{box-shadow:inset 0 -2px 0 var(--text)}
.chip.on .dn,.chip.on .dw{color:var(--text)}
.chip.zero{opacity:.38}
.seg{display:inline-flex;gap:14px;margin-left:auto;align-self:center;padding-bottom:6px}
.seg button{background:none;border:none;padding:0;font-size:12.5px;color:var(--text-3)}
.seg button:hover{color:var(--text)}
.seg button.on{color:var(--text);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* ---------- Session list ---------- */
.list{padding:4px 32px 110px;max-width:1000px}
.daygroup{margin-top:34px}
.daygroup-h{position:sticky;top:var(--top);z-index:10;display:flex;align-items:baseline;gap:12px;padding:14px 12px 12px;background:var(--bg)}
.daygroup-h .d{font-family:var(--serif);font-weight:800;font-size:27px;line-height:1.1;letter-spacing:-.025em}
.daygroup-h .n{font-size:12.5px;color:var(--text-3)}
.timedivider{height:0;border-top:1px solid var(--border-2);margin-top:22px}
.timedivider + .card{border-top-color:transparent}

.card{border-top:1px solid var(--border);background:transparent;scroll-margin-top:calc(var(--top) + 64px);transition:background .12s}
.card:hover{background:var(--bg-1)}
.card.open{background:var(--bg-1)}
.card-row{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:20px;padding:16px 12px;cursor:pointer;align-items:start}
.daybar,.phead,.ptoolbar{max-width:1000px}
.time{font-size:13px;color:var(--text);font-weight:500;font-variant-numeric:tabular-nums;padding-top:1px;white-space:nowrap}
.time .t1{display:block}
.body{min-width:0}
.title{font-size:15px;font-weight:550;letter-spacing:-.012em;line-height:1.38;color:var(--text);margin:0 0 4px;text-wrap:pretty}
.meta{font-size:12.5px;color:var(--text-3);line-height:1.5}
.sep{margin:0 7px;color:#c4c4bf}
.mi{white-space:nowrap}
.meta .saved{color:var(--star);font-weight:500}
.people{color:var(--text-3);font-size:12.5px;margin-top:3px;line-height:1.5}
.people b{color:var(--text-2);font-weight:500}
.card-side{display:flex;align-items:center;gap:0;margin-top:-4px}
.star{background:none;border:none;padding:6px;border-radius:6px;color:#c9c9c4;display:grid;place-items:center;transition:color .12s}
.star:hover{color:var(--star)}
.star.on{color:var(--star)}
.star svg{width:16px;height:16px}
.chev{color:var(--text-3);padding:6px;display:grid;place-items:center;opacity:0;transition:transform .18s,opacity .12s}
.card:hover .chev,.card.open .chev{opacity:1}
.card.open .chev{transform:rotate(90deg)}
@keyframes flashbg{0%{background:var(--accent-soft)}100%{background:transparent}}
.flash{animation:flashbg 1.8s ease-out}

/* ---------- Expanded detail ---------- */
.detail{display:none}
.card.open .detail{display:block;padding:0 12px 22px 116px}
.dtracks{font-size:12px;color:var(--text-3);margin:0 0 12px}
.detail .info{color:var(--text-2);font-size:13.5px;line-height:1.68;max-width:68ch}
.detail .info p{margin:0 0 10px}
.subheat{margin:20px 0 2px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.pres{display:flex;gap:10px;align-items:flex-start;padding:13px 0;margin:0;border-top:1px solid var(--border);scroll-margin-top:calc(var(--top) + 64px)}
.subheat + .pres{border-top:none}
.pres-body{flex:1;min-width:0}
.pres-t{display:flex;gap:14px;align-items:baseline}
.pres-time{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.pres-title{font-size:13.5px;color:var(--text);font-weight:500;line-height:1.42;min-width:0}
.pres-people{font-size:12px;color:var(--text-3);margin-top:3px}
.pres-abs{font-size:13px;color:var(--text-2);line-height:1.68;margin-top:10px;display:none;max-width:70ch}
.pres.exp .pres-abs{display:block}
.pres-abs p{margin:0 0 9px}
.pres-more{font-size:12px;color:var(--text-2);cursor:pointer;margin-top:6px;display:inline-block;text-decoration:underline;text-decoration-color:var(--border-2);text-underline-offset:3px}
.pres-more:hover{color:var(--text);text-decoration-color:var(--text-3)}
.pres-star{flex:none;padding:3px;margin-top:-2px}
.pres-star svg{width:14px;height:14px}
.abs-cap{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.au-text{font-size:12px;color:var(--text-3);line-height:1.6}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:90px 20px;color:var(--text-3);font-size:13.5px}
.empty h3{font-family:var(--serif);font-weight:800;font-size:25px;letter-spacing:-.02em;color:var(--text);margin:0 0 8px}
.empty p{max-width:44ch;margin:0 auto;line-height:1.6}
.loading{padding:60px;text-align:center;color:var(--text-3)}

/* ---------- Posters ---------- */
.phead{padding:30px 32px 6px}
.phead-title{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.08;letter-spacing:-.025em;color:var(--text);max-width:30ch;text-wrap:balance}
.phead-meta{font-size:12.5px;color:var(--text-3);margin-top:8px}
.ptoolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 32px 14px;border-bottom:1px solid var(--border)}
.ptracks{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.ptracks .chip{flex-direction:row;gap:6px;padding:3px 11px;border:1px solid var(--border);border-radius:999px;box-shadow:none;font-size:12px;color:var(--text-2);background:var(--bg)}
.ptracks .chip:hover{border-color:var(--border-2);color:var(--text)}
.ptracks .chip .c{font-size:11px;min-height:0}
.ptracks .chip.on{background:var(--text);border-color:var(--text);color:#fff}
.ptracks .chip.on .c{color:rgba(255,255,255,.65)}
.ptracks .chip .dot{display:none}
.seg.pseg{padding-bottom:0}
body.posters-view .daybar{padding:0;border-bottom:none;display:block}
.pgroup-h{position:sticky;top:var(--top);z-index:9;display:flex;align-items:baseline;gap:10px;padding:22px 12px 9px;background:var(--bg)}
.pgroup-h .d{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.005em}
.pgroup-h .n{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.poster{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:start;gap:16px;padding:14px 12px;border-top:1px solid var(--border);background:transparent;scroll-margin-top:calc(var(--top) + 56px);transition:background .12s}
.poster:hover,.poster.exp{background:var(--bg-1)}
.poster-board{font-size:12px;font-weight:500;color:var(--text-3);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.poster-main{cursor:pointer;min-width:0}
.poster .star{margin-top:-4px}
.poster-title{font-size:14px;font-weight:500;color:var(--text);line-height:1.42;letter-spacing:-.005em;text-wrap:pretty}
.poster-meta{font-size:12.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.poster-ctx{font-size:12px;color:var(--text-3);margin-bottom:3px}
.poster-abs{display:none;font-size:13px;color:var(--text-2);line-height:1.68;margin-top:12px;max-width:70ch}
.poster.exp .poster-abs{display:block}
.poster-abs p{margin:0 0 9px}
.phead-note{font-size:12px;color:var(--text-3);margin-top:8px}

/* ---------- Calendar ---------- */
body.calendar-view .list{padding:0}
body.calendar-view .daybar{padding:0;border-bottom:none;display:block}
.cal-stack{padding:4px 32px 80px;max-width:1080px}
.cal-day{margin-top:26px}
.cal-day-h{position:sticky;top:var(--top);z-index:6;display:flex;align-items:baseline;gap:12px;padding:14px 0 10px;background:var(--bg)}
.cal-day-h .d{font-family:var(--serif);font-weight:800;font-size:27px;line-height:1.1;letter-spacing:-.025em;color:var(--text)}
.cal-day-h .n{font-size:12.5px;color:var(--text-3)}
.cal-cluster{display:flex;gap:18px;padding:14px 0;border-top:1px solid var(--border)}
.cal-cluster-time{flex:none;width:66px;font-size:13px;color:var(--text);font-weight:500;font-variant-numeric:tabular-nums;padding-top:9px}
.cal-cluster-cols{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto}
.cal-col2{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.calc-card{position:relative;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:11px 32px 12px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.calc-card:hover{border-color:var(--border-2);background:var(--bg-1)}
.calc-time{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.calc-title{font-size:13.5px;font-weight:550;color:var(--text);line-height:1.38;margin-top:3px;letter-spacing:-.008em}
.calc-people{font-size:12px;color:var(--text-2);line-height:1.5;margin-top:4px}
.calc-room{font-size:11.5px;color:var(--text-3);margin-top:5px;display:flex;align-items:center;gap:5px}
.calc-room svg{width:12px;height:12px;flex:none;opacity:.7}
.calc-sess{font-size:11.5px;color:var(--text-3);margin-top:4px}
.calc-star{position:absolute;top:7px;right:7px;padding:2px}
.calc-star svg{width:14px;height:14px}
.calc-substar{position:absolute;top:0;right:0;padding:2px}
.calc-substar svg{width:13px;height:13px}
.calc-nested{margin-top:11px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.calc-sub{position:relative;padding:0 22px 0 12px;border-left:1px solid var(--border-2)}
.calc-sub .calc-title{font-size:12.5px;font-weight:500;margin-top:1px}

/* calendar sidebar agenda */
.agenda-row{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:6px}
.agenda-row:hover{background:var(--bg-2)}
.agenda-row .star{padding:1px;margin-top:1px;flex:none}
.agenda-row .star svg{width:13px;height:13px}
.agenda-b{min-width:0}
.agenda-t{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.agenda-title{font-size:12.5px;color:var(--text);line-height:1.38;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- Mobile ---------- */
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:60;width:282px;transform:translateX(-100%);transition:transform .22s;box-shadow:0 0 0 1px var(--border),0 12px 40px rgba(20,21,26,.12)}
  .sidebar.show{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(20,21,26,.28);z-index:50}
  .scrim.show{display:block}
  .menu-btn{display:grid;place-items:center;background:none;border:none;color:var(--text-2);width:34px;height:34px;border-radius:8px;flex:none;margin-left:-8px}
  .search .kbd{display:none}
  .topbar,.list,.cal-stack{padding-left:16px;padding-right:16px}
  .daybar{padding-left:10px;padding-right:10px;overflow-x:auto;flex-wrap:nowrap}
  .chip{padding:6px 9px 10px}
  .seg{display:none}
  .phead,.ptoolbar{padding-left:16px;padding-right:16px}
  .card-row{grid-template-columns:58px minmax(0,1fr) auto;gap:12px;padding:14px 6px}
  .card.open .detail{padding:0 6px 20px 76px}
  .poster{grid-template-columns:50px minmax(0,1fr) auto;gap:12px;padding:13px 6px}
  .daygroup-h,.pgroup-h{padding-left:6px;padding-right:6px}
  .daygroup-h .d,.cal-day-h .d{font-size:24px}
  .cal-cluster{flex-direction:column;gap:8px}
  .cal-cluster-time{padding-top:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div>
        <h1>ASHG 2026</h1>
        <div class="sub">Montréal · Oct 18–24</div>
      </div>
    </div>
    <div class="viewswitch">
      <button data-view="program" class="on">Program</button>
      <button data-view="posters">Posters</button>
      <button data-view="calendar">Calendar</button>
    </div>
    <div id="filters"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Filters">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="text" placeholder="Search sessions, speakers, abstracts…" autocomplete="off" spellcheck="false" />
        <span class="kbd">/</span>
      </div>
      <div class="count" id="count"></div>
    </div>

    <div class="daybar" id="daybar"></div>
    <div class="list" id="list"><div class="loading">Loading program…</div></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var D = window.ASHG_DATA;
  if(!D){document.getElementById('list').innerHTML='<div class="empty"><h3>Could not load data</h3><p>data.js is missing.</p></div>';return;}

  // ---- track colors ----
  var TRACK_COLORS = ['#7c85f3','#e2607a','#4cc4a0','#e6a94c','#b06ab3','#5aa9e6','#e07a5f','#8bc34a','#c56cf0','#4db6ac','#f06292','#9575cd','#64b5f6','#ffb74d'];
  var trackColor = {};
  D.tracks.forEach(function(t,i){trackColor[t]=TRACK_COLORS[i%TRACK_COLORS.length];});

  var TYPE_COLORS = {
    'Plenary Sessions':'#e2607a','Platform Sessions':'#7c85f3','Poster Presentations':'#4cc4a0',
    'Featured Symposia':'#c56cf0','Workshops and Courses':'#e6a94c','Lightning Talks':'#5aa9e6',
    'Industry Events':'#8a8f98','Ancillary Events':'#8a8f98','Networking and Social Events':'#e07a5f',
    'Professional Education Sessions':'#64b5f6'
  };
  function typeColor(t){return TYPE_COLORS[t]||'#8a8f98';}

  // ---- state ----
  var state={view:'program',q:'',days:new Set(),
             types:new Set(['Featured Symposia','Platform Sessions','Plenary Sessions']),
             tracks:new Set(),rooms:new Set(),starOnly:false,
             pSession:null,pTracks:new Set(),pSort:'track'};
  var stars=new Set(JSON.parse(localStorage.getItem('ashg_stars')||'[]'));
  function saveStars(){localStorage.setItem('ashg_stars',JSON.stringify([].concat(Array.from(stars))));}
  var openCards=new Set();

  // ---- poster sessions ----
  var sessionIds=new Set(D.sessions.map(function(s){return s.id;}));
  var POSTERS=D.sessions.filter(function(s){return s.st.indexOf('Poster Presentations')>-1;});
  var posterById={};
  POSTERS.forEach(function(s){
    posterById[s.id]=s;
    (s.pr||[]).forEach(function(p){
      p._sess=s;
      var parts=[p.t].concat(p.tr||[]);
      (p.sp||[]).forEach(function(x){if(x)parts.push(x.n,x.a);});
      if(p.abs)parts.push(p.abs); if(p.au)parts.push(p.au); if(p.board)parts.push('board '+p.board);
      p._search=parts.join('  ').toLowerCase();
    });
  });
  var ALL_POSTERS=[];POSTERS.forEach(function(s){(s.pr||[]).forEach(function(p){ALL_POSTERS.push(p);});});
  if(POSTERS.length)state.pSession=POSTERS[0].id;
  var POSTERS_HAVE_BOARDS=POSTERS.some(function(s){return (s.pr||[]).some(function(p){return boardOf(p)!=null;});});
  function starredPosters(){var a=[];POSTERS.forEach(function(s){(s.pr||[]).forEach(function(p){if(stars.has(p.id))a.push(p);});});return a;}
  function isPosterSession(s){return s.st.indexOf('Poster Presentations')>-1;}
  // a session belongs in My Schedule if it is starred, or (non-poster) contains a starred talk
  function sessionStarred(s){
    if(stars.has(s.id))return true;
    if(isPosterSession(s))return false;
    return (s.pr||[]).some(function(p){return stars.has(p.id);});
  }
  function sessionHasStarredTalk(s){return !stars.has(s.id)&&!isPosterSession(s)&&(s.pr||[]).some(function(p){return stars.has(p.id);});}
  var openPosters=new Set();
  // link every presentation to its parent session + day (for the calendar view)
  var presById={};
  D.sessions.forEach(function(s){(s.pr||[]).forEach(function(p){p._sess=s;p._day=s.day;presById[p.id]=p;});});

  // ---- precompute search text ----
  D.sessions.forEach(function(s){
    var parts=[s.t,s.sub].concat(s.tr,s.st,s.rm);
    [].concat(s.sp,s.ch,s.mo).forEach(function(p){if(p)parts.push(p.n,p.a);});
    if(s.abs)parts.push(s.abs);
    (s.pr||[]).forEach(function(p){
      parts.push(p.t);(p.sp||[]).forEach(function(x){if(x)parts.push(x.n,x.a);});
      if(p.abs)parts.push(p.abs); if(p.au)parts.push(p.au); if(p.board)parts.push('board '+p.board);
    });
    s._search=parts.join('  ').toLowerCase();
  });

  function strip(html){var d=document.createElement('div');d.innerHTML=html;return d.textContent||'';}
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  // plain text (with blank-line paragraphs) -> safe paragraph HTML
  function fmtText(t){if(!t)return '';return '<p>'+esc(t).split(/\n{2,}/).map(function(x){return x.replace(/\n/g,'<br>');}).join('</p><p>')+'</p>';}
  // expandable Abstract + Authors block shared by posters and presentations
  function bodyBlock(x){
    var h='';
    if(x.abs)h+='<div class="abs-cap">Abstract</div>'+fmtText(x.abs);
    if(x.au)h+='<div class="abs-cap"'+(x.abs?' style="margin-top:12px"':'')+'>Authors</div><div class="au-text">'+esc(x.au)+'</div>';
    return h;
  }

  var DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function longDate(ymd){if(!ymd)return 'Date TBD';var p=ymd.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));return DOWL[d.getUTCDay()]+', '+d.getUTCDate()+' '+MONL[d.getUTCMonth()];}
  var TYPE_SINGULAR={'Platform Sessions':'Platform session','Plenary Sessions':'Plenary session','Featured Symposia':'Featured symposium','Poster Presentations':'Poster session','Workshops and Courses':'Workshop','Lightning Talks':'Lightning talks','Industry Events':'Industry event','Ancillary Events':'Ancillary event','Networking and Social Events':'Networking event','Professional Education Sessions':'Professional education'};
  function typeName(t){return TYPE_SINGULAR[t]||t;}
  var SEP='<span class="sep">·</span>';

  // ---- counts helper (respects OTHER active filters, faceted) ----
  function matches(s,ignore){
    if(state.starOnly && !sessionStarred(s))return false;
    if(ignore!=='q' && state.q){if(s._search.indexOf(state.q)===-1)return false;}
    if(ignore!=='days' && state.days.size && !state.days.has(s.day))return false;
    if(ignore!=='types' && state.types.size && !s.st.some(function(t){return state.types.has(t);}))return false;
    if(ignore!=='tracks' && state.tracks.size){
      if(state.tracks.has('__none__')){ if(s.tr.length && !s.tr.some(function(t){return state.tracks.has(t);}))return false; }
      else if(!s.tr.some(function(t){return state.tracks.has(t);}))return false;
    }
    if(ignore!=='rooms' && state.rooms.size && !s.rm.some(function(r){return state.rooms.has(r);}))return false;
    return true;
  }
  function facetCount(dim,val){
    var n=0;
    for(var i=0;i<D.sessions.length;i++){
      var s=D.sessions[i];
      if(!matches(s,dim))continue;
      if(dim==='days'&&s.day===val)n++;
      else if(dim==='types'&&s.st.indexOf(val)>-1)n++;
      else if(dim==='tracks'){ if(val==='__none__'){if(!s.tr.length)n++;} else if(s.tr.indexOf(val)>-1)n++; }
      else if(dim==='rooms'&&s.rm.indexOf(val)>-1)n++;
    }
    return n;
  }

  // ---- build sidebar ----
  var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>';
  var typeCounts={},roomCounts={},noTrackCount=0;
  D.sessions.forEach(function(s){
    s.st.forEach(function(t){typeCounts[t]=(typeCounts[t]||0)+1;});
    s.rm.forEach(function(r){roomCounts[r]=(roomCounts[r]||0)+1;});
    if(!s.tr.length)noTrackCount++;
  });

  function buildFilters(){
    var h='';
    // reset
    h+='<div class="side-top"><span>Filters</span><button class="side-reset" id="resetBtn" disabled>Clear all</button></div>';
    // My schedule
    h+='<div class="side-sec"><div class="opt star-opt" id="starToggle" data-toggle="star">'+
       '<span class="box">'+CHECK+'</span><span class="lbl">My Schedule</span>'+
       '<span class="n" id="starCount">'+stars.size+'</span></div></div>';
    // Session type
    h+=group('Session type','types',D.sessionTypes.map(function(t){return{v:t,label:t,color:typeColor(t)};}));
    // Track

    tr.push({v:'__none__',label:'No track assigned',color:'#3a3b40'});
    h+=group('Track','tracks',tr);
    // Room
    h+=group('Room','rooms',D.rooms.map(function(r){return{v:r,label:r};}));
    document.getElementById('filters').innerHTML=h;
  }
  function group(title,dim,items){
    var h='<div class="side-sec" data-sec="'+dim+'"><div class="side-head"><span>'+title+'</span>'+
      '<button class="clr" data-clear="'+dim+'">Clear</button></div>';
    items.forEach(function(it){
      h+='<div class="opt" data-dim="'+dim+'" data-val="'+esc(it.v)+'">'+

  // ---- day bar ----
  function buildDayBar(){
    var h='';
    D.days.forEach(function(d){
      var dp=d.l.split(' ');
      h+='<button class="chip" data-day="'+d.d+'" title="'+esc(d.l)+'"><span class="dw">'+dp[0]+'</span><span class="dn">'+dp[1]+'</span><span class="c" data-daycount="'+d.d+'"></span></button>';
    });
    h+='<div class="seg"><button data-exp="0" class="on">Collapse all</button><button data-exp="1">Expand all</button></div>';
    document.getElementById('daybar').innerHTML=h;
  }

  // ---- render dispatcher ----
  function render(){
    if(state.view==='posters')renderPosters();
    else if(state.view==='calendar')renderCalendar();
    else renderProgram();
  }

  // ---- render program list ----
  function renderProgram(){
    var filtered=D.sessions.filter(function(s){return matches(s,null);});
    // in My Schedule, auto-expand sessions that are here only because a talk inside is starred
    if(state.starOnly)filtered.forEach(function(s){if(sessionHasStarredTalk(s))openCards.add(s.id);});
    // group by day
    var groups={},order=[];
    filtered.forEach(function(s){
      if(!groups[s.day]){groups[s.day]=[];order.push(s.day);}
      groups[s.day].push(s);
    });
    var html='';
    if(!filtered.length){
      html='<div class="empty"><h3>No sessions match</h3><p>Try removing a filter or clearing the search.</p></div>';
    }
    order.forEach(function(day){
      var arr=groups[day];var dl=arr[0].dl;
      html+='<div class="daygroup"><div class="daygroup-h"><span class="d">'+esc(longDate(day))+'</span><span class="n">'+arr.length+' session'+(arr.length>1?'s':'')+'</span></div>';
      arr.forEach(function(s,i){
        var newBlock=(i===0||s.t1!==arr[i-1].t1);
        if(i>0&&newBlock)html+='<div class="timedivider"></div>';
        html+=cardHTML(s,newBlock);
      });
      html+='</div>';
    });
    var list=document.getElementById('list');
    list.innerHTML=html;
    // counts
    document.getElementById('count').textContent=filtered.length+' of '+D.sessions.length+' sessions';
    updateFacetCounts();
  }

  // ================= POSTER VIEW =================
  function buildPosterNav(){
    var picks=starredPosters().length;
    var h='<div class="side-sec" style="padding-top:12px"><div class="opt pnav star-opt'+(state.pSession==='__picks__'?' on':'')+'" data-psession="__picks__">'+
          '<span class="lbl">My poster picks</span>'+
          '<span class="n">'+picks+'</span></div></div>';
    // group poster sessions by day
    var byDay={},order=[];
    POSTERS.forEach(function(s){if(!byDay[s.day]){byDay[s.day]=[];order.push(s.day);}byDay[s.day].push(s);});
    order.forEach(function(day){
      var arr=byDay[day];
      h+='<div class="side-sec"><div class="side-head"><span>'+esc(arr[0].dl)+'</span></div>';
      arr.forEach(function(s){
        h+='<div class="opt pnav'+(state.pSession===s.id?' on':'')+'" data-psession="'+s.id+'" title="'+esc(s.t)+'">'+
           '<span class="lbl">'+esc(shortPoster(s.t))+'</span>'+
           '<span class="n">'+(s.pr||[]).length+'</span></div>';
      });
      h+='</div>';
    });
    document.getElementById('filters').innerHTML=h;
  }
  function shortPoster(t){return t.replace(/\s*Poster\s+(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)?\s*Session\s*/i,'').trim()||t;}

  function currentPosters(){
    if(state.pSession==='__picks__')return starredPosters();
    if(state.q)return ALL_POSTERS; // a query searches across every poster
    var s=posterById[state.pSession];return s?(s.pr||[]):[];
  }
  function posterMatch(p){
    if(state.q && p._search.indexOf(state.q)===-1)return false;
    if(state.pTracks.size && !(p.tr||[]).some(function(t){return state.pTracks.has(t);}))return false;
    return true;
  }

  function renderPosters(){
    var isPicks=state.pSession==='__picks__';
    var isSearchAll=!isPicks && !!state.q; // a query searches all posters, across sessions
    var all=currentPosters();
    // scope by query first (so track chips reflect the search), then by track chips
    var qFiltered=state.q?all.filter(function(p){return p._search.indexOf(state.q)>-1;}):all;
    var tracksInSet={};
    qFiltered.forEach(function(p){(p.tr||[]).forEach(function(t){tracksInSet[t]=(tracksInSet[t]||0)+1;});});
    var trackList=Object.keys(tracksInSet).sort();
    var filtered=state.pTracks.size?qFiltered.filter(function(p){return (p.tr||[]).some(function(t){return state.pTracks.has(t);});}):qFiltered;
    var head='';
    if(isPicks){
      head='<div class="phead"><div class="phead-title">★ My poster picks</div>'+
           '<div class="phead-meta">'+all.length+' poster'+(all.length!==1?'s':'')+' saved · sorted by day, time, board number</div></div>';
    }else if(isSearchAll){
      var nSess={};filtered.forEach(function(p){nSess[p._sess.id]=1;});
      head='<div class="phead"><div class="phead-title">All posters</div>'+
           '<div class="phead-meta">'+filtered.length+' poster'+(filtered.length!==1?'s':'')+' matching “'+esc(state.q)+'” across '+Object.keys(nSess).length+' session'+(Object.keys(nSess).length!==1?'s':'')+'</div></div>';
    }else{
      var s=posterById[state.pSession];
      head='<div class="phead"><div class="phead-title">'+esc(s?s.t:'')+'</div>'+
           '<div class="phead-meta">'+(s?esc(s.dl+' · '+s.t1+'–'+s.t2+' · '+s.rm.join(', ')):'')+' · '+all.length+' posters</div></div>';
    }
    // track chips
    var chips='';
    if(trackList.length>1){
      chips='<div class="ptracks">';
      trackList.forEach(function(t){
        chips+='<button class="chip'+(state.pTracks.has(t)?' on':'')+'" data-ptrack="'+esc(t)+'">'+
               esc(t)+'<span class="c">'+tracksInSet[t]+'</span></button>';
      });
      chips+='</div>';
    }
    var sortSeg=(isPicks||isSearchAll)?'':'<div class="seg pseg">'+
      '<button data-psort="track"'+(state.pSort==='track'?' class="on"':'')+'>By track</button>'+
      '<button data-psort="az"'+(state.pSort==='az'?' class="on"':'')+'>A–Z</button>'+
      '<button data-psort="pres"'+(state.pSort==='pres'?' class="on"':'')+'>Presenter</button></div>';
    document.getElementById('daybar').innerHTML=head+'<div class="ptoolbar">'+chips+sortSeg+'</div>';

    // count
    if(isPicks||isSearchAll){
      document.getElementById('count').textContent=filtered.length+' poster'+(filtered.length!==1?'s':'');
    }else{
      var scoped=state.pTracks.size;
      document.getElementById('count').textContent=filtered.length+(scoped?(' of '+all.length):'')+' poster'+((scoped?all.length:filtered.length)!==1?'s':'');
    }

    // sort/group
    var html='';
    if(!POSTERS.length){html='<div class="empty"><h3>No poster sessions</h3></div>';}
    else if(isPicks && !all.length){html='<div class="empty"><h3>No posters saved yet</h3><p>Open a poster session and tap the star on posters you want to visit. They’ll collect here.</p></div>';}
    else if(!filtered.length){html='<div class="empty"><h3>No posters match</h3><p>Try a different search or clear the track filter.</p></div>';}
    else if(isSearchAll){
      // group matches by session, sessions ordered by day/time
      var bySess={};filtered.forEach(function(p){(bySess[p._sess.id]=bySess[p._sess.id]||[]).push(p);});
      var sessIds=Object.keys(bySess).sort(function(a,b){return (posterById[a].sk||'').localeCompare(posterById[b].sk||'')||posterById[a].t.localeCompare(posterById[b].t);});
      sessIds.forEach(function(k){
        var sp=posterById[k];var g=bySess[k].slice().sort(byDayTimeBoard);
        html+='<div class="pgroup-h"><span class="d">'+esc(sp.t)+'</span><span class="n">'+esc(sp.dl+' · '+sp.t1)+' · '+g.length+' here</span></div>';
        g.forEach(function(p){html+=posterHTML(p);});
      });
    }
    else if(isPicks){
      // flat list sorted by day -> time -> board number -> title, grouped by day
      var arr=filtered.slice().sort(byDayTimeBoard);
      var byDay={},order=[];
      arr.forEach(function(p){var d=p._sess.day;if(!byDay[d]){byDay[d]=[];order.push(d);}byDay[d].push(p);});
      order.forEach(function(d){
        var g=byDay[d];
        html+='<div class="pgroup-h"><span class="d">'+esc(g[0]._sess.dl)+'</span><span class="n">'+g.length+' poster'+(g.length!==1?'s':'')+'</span></div>';
        g.forEach(function(p){
          var ctx=esc(p._sess.t1)+' · '+esc(shortPoster(p._sess.t));
          html+=posterHTML(p,ctx);
        });
      });
    }
    else if(state.pSort==='track'){
      var byT={};filtered.forEach(function(p){var t=(p.tr&&p.tr[0])||'Other';(byT[t]=byT[t]||[]).push(p);});
      Object.keys(byT).sort().forEach(function(t){
        var arr=byT[t].sort(byTitle);
        html+='<div class="pgroup-h"><span class="d">'+esc(t)+'</span><span class="n">'+arr.length+'</span></div>';
        arr.forEach(function(p){html+=posterHTML(p);});
      });
    }else{
      var sorted=filtered.slice().sort(state.pSort==='pres'?byPresenter:byTitle);
      sorted.forEach(function(p){html+=posterHTML(p);});
    }
    document.getElementById('list').innerHTML=html;
    // update poster nav active + picks count
    document.querySelectorAll('.pnav').forEach(function(el){el.classList.toggle('on',el.getAttribute('data-psession')===state.pSession);});
    var pk=document.querySelector('.pnav[data-psession="__picks__"] .n');if(pk)pk.textContent=starredPosters().length;
  }
  function byTitle(a,b){return (a.t||'').localeCompare(b.t||'');}
  function byPresenter(a,b){var an=(a.sp&&a.sp[0]&&a.sp[0].n)||'zzz',bn=(b.sp&&b.sp[0]&&b.sp[0].n)||'zzz';return an.localeCompare(bn);}
  // poster board number — not published by ASHG yet; future-proofed if it appears in the data
  function boardOf(p){var b=(p.board!=null?p.board:null);if(b==null)return null;var n=parseInt(b,10);return isNaN(n)?null:n;}
  function byDayTimeBoard(a,b){
    var ad=(a._sess.day||''),bd=(b._sess.day||'');if(ad!==bd)return ad<bd?-1:1;
    var at=(a.sk||a._sess.sk||''),bt=(b.sk||b._sess.sk||'');if(at!==bt)return at<bt?-1:1;
    var ab=boardOf(a),bb=boardOf(b);
    if(ab!=null&&bb!=null&&ab!==bb)return ab-bb;
    if(ab!=null&&bb==null)return -1;if(ab==null&&bb!=null)return 1;
    return (a.t||'').localeCompare(b.t||'');
  }

  function posterHTML(p,ctx){
    var open=openPosters.has(p.id);
    var parts=[];
    var pres=(p.sp||[]).map(function(x){return x.n+(x.a?', '+x.a:'');}).join('; ');
    if(pres)parts.push(esc(pres));
    if(p.tr&&p.tr[0])parts.push(esc(p.tr[0]));
    var bb=bodyBlock(p);
    return '<div class="poster'+(open?' exp':'')+'" data-pid="'+p.id+'">'+
      '<div class="poster-board">'+(p.board?esc(p.board):'')+'</div>'+
      '<div class="poster-main js-ptoggle">'+
        (ctx?'<div class="poster-ctx">'+ctx+'</div>':'')+
        '<div class="poster-title">'+esc(p.t)+'</div>'+
        '<div class="poster-meta">'+parts.join(SEP)+'</div>'+
        (bb?'<div class="poster-abs">'+bb+'</div>':'')+
      '</div>'+
      '<button class="star'+(stars.has(p.id)?' on':'')+'" data-star="'+p.id+'" title="Save poster">'+(stars.has(p.id)?ICON.starFill:ICON.star)+'</button>'+
    '</div>';
  }

  // ---- view switching ----
  function setView(v){
    state.view=v;
    document.querySelectorAll('.viewswitch button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-view')===v);});
    var qEl=document.getElementById('q');
    document.body.classList.toggle('posters-view',v==='posters');
    document.body.classList.toggle('calendar-view',v==='calendar');
    if(v==='posters'){
      qEl.placeholder='Search all posters…';
      buildPosterNav();
    }else if(v==='calendar'){
      qEl.placeholder='Search sessions, speakers, abstracts…';
      buildCalendarNav();
    }else{
      qEl.placeholder='Search sessions, speakers, abstracts…';
      buildFilters();
      buildDayBar();
    }
    // reset scoped query so it doesn't carry confusingly between views
    state.q='';qEl.value='';
    render();
  }

  // ================= CALENDAR VIEW =================
  function locMin(iso){ // -> [ymd, minutesFromMidnight] in Montreal time (UTC-4)
    if(!iso)return null;
    var d=new Date(new Date(iso).getTime()-4*3600*1000);
    var ymd=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
    return [ymd, d.getUTCHours()*60+d.getUTCMinutes()];
  }
  function pad(n){return n<10?'0'+n:''+n;}
  function calColor(it){
    if(it.kind==='session')return typeColor(it.ref.st[0]);
    var tr=(it.ref.tr&&it.ref.tr[0]);
    return tr?(trackColor[tr]||'var(--accent)'):'var(--accent)';
  }
  function scheduleItems(){
    var items=[];
    D.sessions.forEach(function(s){
      if(stars.has(s.id)){
        var a=locMin(s.s),b=locMin(s.e);
        if(a)items.push({id:s.id,kind:'session',title:s.t,sub:'',room:s.rm.join(', '),
          day:a[0],dl:s.dl,startMin:a[1],endMin:b?b[1]:a[1]+60,ref:s});
      }
      // posters live in "My poster picks", not the calendar
      if(s.st.indexOf('Poster Presentations')>-1)return;
      (s.pr||[]).forEach(function(p){
        if(stars.has(p.id)){
          var a=locMin(p.s),b=locMin(p.e);
          if(a)items.push({id:p.id,kind:'talk',
            title:p.t,sub:s.t,room:(p.rm&&p.rm.length?p.rm.join(', '):s.rm.join(', ')),
            day:a[0],dl:s.dl,startMin:a[1],endMin:b?b[1]:a[1]+30,ref:p});
        }
      });
    });
    return items;
  }

  function buildCalendarNav(){
    var items=scheduleItems();
    var h='<div class="side-top"><span>My schedule · '+items.length+'</span>'+
          (items.length?'<button class="side-reset" id="clearSched">Clear all</button>':'')+'</div>';
    // agenda grouped by day
    var byDay={},order=[];
    items.slice().sort(function(a,b){return (a.day+pad2(a.startMin)).localeCompare(b.day+pad2(b.startMin));}).forEach(function(it){
      if(!byDay[it.day]){byDay[it.day]=[];order.push(it.day);}byDay[it.day].push(it);
    });
    order.forEach(function(day){
      h+='<div class="side-sec"><div class="side-head"><span>'+esc(byDay[day][0].dl)+'</span></div>';
      byDay[day].forEach(function(it){
        h+='<div class="agenda-row"><button class="star on" data-star="'+it.id+'" title="Remove">'+ICON.starFill+'</button>'+
           '<div class="agenda-b"><div class="agenda-t">'+esc(fmtMin(it.startMin))+'</div>'+
           '<div class="agenda-title">'+esc(it.title)+'</div></div></div>';
      });
      h+='</div>';
    });
    document.getElementById('filters').innerHTML=h;
  }
  function pad2(n){n=Math.round(n);return (n<1000?'000'+n:''+n).slice(-4);}
  function fmtMin(m){var h=Math.floor(m/60),mm=m%60;var ap=h<12?'AM':'PM';var hh=h%12||12;return hh+':'+pad(mm)+' '+ap;}

  function calTalkPresenters(p){return (p.sp||[]).map(function(x){return x.n;}).join(', ');}
  function calSessionPeople(s){
    var out=[];
    if(s.ch&&s.ch.length)out.push('Chairs: '+s.ch.map(function(x){return x.n;}).join(', '));
    if(s.sp&&s.sp.length)out.push('Speakers: '+s.sp.map(function(x){return x.n;}).join(', '));
    return out.join('  ·  ');
  }
  function calCard(e){
    var timeLbl=fmtMin(e.startMin)+'–'+fmtMin(e.endMin);
    if(e.kind==='session'){
      var s=e.sess, people=calSessionPeople(s), room=(s.rm&&s.rm.length?s.rm.join(', '):'');
      var nested='';
      if(e.nested&&e.nested.length){
        nested='<div class="calc-nested">'+e.nested.map(function(p){
          var tl=(p.t1||'')+(p.t2?'–'+p.t2:'');
          return '<div class="calc-sub" data-evid="'+p.id+'">'+
            '<button class="star on calc-substar" data-star="'+p.id+'" title="Remove from schedule">'+ICON.starFill+'</button>'+
            '<div class="calc-time">'+esc(tl)+'</div>'+
            '<div class="calc-title">'+esc(p.t)+'</div>'+
            (calTalkPresenters(p)?'<div class="calc-people">'+esc(calTalkPresenters(p))+'</div>':'')+
          '</div>';
        }).join('')+'</div>';
      }
      return '<div class="calc-card k-session" data-evid="'+s.id+'">'+
        '<button class="star on calc-star" data-star="'+s.id+'" title="Remove from schedule">'+ICON.starFill+'</button>'+
        '<div class="calc-time">'+esc(timeLbl)+'</div>'+
        '<div class="calc-title">'+esc(s.t)+'</div>'+
        (people?'<div class="calc-people">'+esc(people)+'</div>':'')+
        (room?'<div class="calc-room">'+ICON.pin+esc(room)+'</div>':'')+
        nested+
      '</div>';
    }
    var p=e.ref, ps=e.sess, room2=(p.rm&&p.rm.length?p.rm.join(', '):(ps.rm&&ps.rm.length?ps.rm.join(', '):''));
    return '<div class="calc-card k-talk" data-evid="'+p.id+'">'+
      '<button class="star on calc-star" data-star="'+p.id+'" title="Remove from schedule">'+ICON.starFill+'</button>'+
      '<div class="calc-time">'+esc(timeLbl)+'</div>'+
      '<div class="calc-title">'+esc(p.t)+'</div>'+
      (calTalkPresenters(p)?'<div class="calc-people">'+esc(calTalkPresenters(p))+'</div>':'')+
      '<div class="calc-sess">'+esc(ps.t)+'</div>'+
      (room2?'<div class="calc-room">'+ICON.pin+esc(room2)+'</div>':'')+
    '</div>';
  }

  function renderCalendar(){
    var totalItems=scheduleItems().length;
    var q=state.q;
    function talkSearch(p){return (p.t+' '+calTalkPresenters(p)+' '+(p.abs||'')).toLowerCase();}
    // build entries: starred sessions (with nested starred talks) + standalone starred talks
    var entries=[];
    D.sessions.forEach(function(s){
      if(isPosterSession(s))return;
      var starTalks=(s.pr||[]).filter(function(p){return stars.has(p.id);}).sort(function(a,b){return (a.sk||'').localeCompare(b.sk||'');});
      if(stars.has(s.id)){
        var a=locMin(s.s),b=locMin(s.e);if(!a)return;
        if(q && s._search.indexOf(q)===-1)return;
        entries.push({kind:'session',ref:s,sess:s,day:a[0],dl:s.dl,startMin:a[1],endMin:b?b[1]:a[1]+60,nested:starTalks});
      }else{
        starTalks.forEach(function(p){
          var a=locMin(p.s),b=locMin(p.e);if(!a)return;
          if(q && talkSearch(p).indexOf(q)===-1)return;
          entries.push({kind:'talk',ref:p,sess:s,day:a[0],dl:s.dl,startMin:a[1],endMin:b?b[1]:a[1]+30});
        });
      }
    });
    document.getElementById('daybar').innerHTML='<div class="phead"><div class="phead-title">My Schedule</div>'+
      '<div class="phead-meta">'+totalItems+' starred item'+(totalItems!==1?'s':'')+' · sessions &amp; talks you’ve saved (posters live in My poster picks)</div></div>';
    document.getElementById('count').textContent=(q?entries.length+' matching · ':'')+totalItems+' starred';
    var list=document.getElementById('list');
    if(!totalItems){
      list.innerHTML='<div class="empty"><h3>Your schedule is empty</h3><p>Tap the ☆ on any session or presentation and it will appear here grouped by day and time — so you can spot overlaps at a glance. (Starred posters go to <b>My poster picks</b>.)</p></div>';
      return;
    }
    if(!entries.length){list.innerHTML='<div class="empty"><h3>No matches</h3><p>Nothing in your schedule matches “'+esc(q)+'”.</p></div>';return;}
    var byDay={},order=[];
    entries.forEach(function(e){if(!byDay[e.day]){byDay[e.day]=[];order.push(e.day);}byDay[e.day].push(e);});
    order.sort();
    var html='<div class="cal-stack">';
    order.forEach(function(day){
      var arr=byDay[day].slice().sort(function(a,b){return a.startMin-b.startMin||a.endMin-b.endMin;});
      html+='<div class="cal-day"><div class="cal-day-h"><span class="d">'+esc(longDate(day))+'</span><span class="n">'+arr.length+' item'+(arr.length!==1?'s':'')+'</span></div>';
      // split into clusters of overlapping entries, lane-pack each, render columns
      var cl=[],maxEnd=-1;
      function flush(){
        if(!cl.length)return;
        var laneEnd=[];
        cl.forEach(function(e){var lane=-1;for(var i=0;i<laneEnd.length;i++){if(e.startMin>=laneEnd[i]){lane=i;break;}}if(lane===-1){lane=laneEnd.length;laneEnd.push(0);}e._lane=lane;laneEnd[lane]=e.endMin;});
        var cols=[];for(var i=0;i<laneEnd.length;i++)cols.push([]);
        cl.forEach(function(e){cols[e._lane].push(e);});
        var startLabel=fmtMin(Math.min.apply(null,cl.map(function(e){return e.startMin;})));
        html+='<div class="cal-cluster"><div class="cal-cluster-time">'+esc(startLabel)+'</div><div class="cal-cluster-cols">';
        cols.forEach(function(col){html+='<div class="cal-col2">'+col.map(calCard).join('')+'</div>';});
        html+='</div></div>';
        cl=[];maxEnd=-1;
      }
      arr.forEach(function(e){if(cl.length && e.startMin>=maxEnd)flush();cl.push(e);maxEnd=Math.max(maxEnd,e.endMin);});
      flush();
      html+='</div>';
    });
    html+='</div>';
    list.innerHTML=html;
  }

  function flashEl(el,block){
    if(!el)return;
    el.scrollIntoView({behavior:'smooth',block:block||'center'});
    el.classList.add('flash');
    setTimeout(function(){el.classList.remove('flash');},1500);
  }

  // jump from a calendar block to the item's detail in Program / Posters
  function goToItem(id){
    if(sessionIds.has(id)){openSessionInProgram(id,null);return;}
    var p=presById[id];if(!p)return;
    var s=p._sess;
    if(s.st.indexOf('Poster Presentations')>-1){
      state.pSession=s.id;state.pTracks.clear();openPosters.add(id);
      setView('posters'); // renders synchronously
      flashEl(document.querySelector('.poster[data-pid="'+id+'"]'),'center');
    }else{
      openSessionInProgram(s.id,id);
    }
  }
  function openSessionInProgram(sid,presId){
    // clear filters so the target session is guaranteed visible
    state.types.clear();state.tracks.clear();state.rooms.clear();state.days.clear();state.starOnly=false;
    openCards.add(sid);
    setView('program'); // renders synchronously
    var card=document.querySelector('.card[data-id="'+sid+'"]');
    if(!card)return;
    if(presId){
      var target=[].filter.call(card.querySelectorAll('.pres'),function(pr){var st=pr.querySelector('[data-star]');return st&&st.getAttribute('data-star')===presId;})[0];
      if(target){
        if(!target.classList.contains('exp')){var more=target.querySelector('.js-absmore');if(more){target.classList.add('exp');more.textContent='Hide '+(more.getAttribute('data-label')||'abstract');}}
        flashEl(target,'center');return;
      }
    }
    flashEl(card,'start');
  }

  function cardHTML(s,showTime){
    var open=openCards.has(s.id);
    var parts=[];
    function mi(x){return '<span class="mi">'+x+'</span>';}
    if(s.st.length)parts.push(mi(esc(typeName(s.st[0]))));
    if(s.sub)parts.push(mi(esc(s.sub)));
    if(s.dur)parts.push(mi(esc(s.dur)));
    if(s.rm.length)parts.push(esc(s.rm.join(', ')));
    var nStar=(s.pr||[]).reduce(function(a,p){return a+(stars.has(p.id)?1:0);},0);
    if(nStar)parts.push('<span class="saved mi">★ '+nStar+' saved</span>');
    var people='';
    var chairs=s.ch.length?'<b>Chairs</b> '+esc(s.ch.map(nm).join(', ')):'';
    var mods=s.mo.length?'<b>Moderators</b> '+esc(s.mo.map(nm).join(', ')):'';
    var speakers=s.sp.length?'<b>Speakers</b> '+esc(shorten(s.sp)):'';
    var pl=[chairs,mods,speakers].filter(Boolean).slice(0,2).join(SEP);
    if(pl)people='<div class="people">'+pl+'</div>';
    return '<div class="card'+(open?' open':'')+'" data-id="'+s.id+'">'+
      '<div class="card-row js-toggle">'+
        '<div class="time">'+(showTime===false?'':'<span class="t1">'+esc(s.t1)+'</span>')+'</div>'+
        '<div class="body">'+
          '<div class="title">'+esc(s.t)+'</div>'+
          '<div class="meta">'+parts.join(SEP)+'</div>'+
          people+
        '</div>'+
        '<div class="card-side">'+
          '<button class="star'+(stars.has(s.id)?' on':'')+'" data-star="'+s.id+'" title="Add to My Schedule">'+(stars.has(s.id)?ICON.starFill:ICON.star)+'</button>'+
          '<span class="chev">'+ICON.chev+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="detail">'+(open?detailHTML(s):'')+'</div>'+
    '</div>';
  }
  function nm(p){return p.n;}
  function shorten(arr){var names=arr.map(nm);if(names.length>4)return names.slice(0,4).join(', ')+' +'+(names.length-4)+' more';return names.join(', ');}

  function detailHTML(s){
    var h='';
    if(s.tr&&s.tr.length)h+='<div class="dtracks">'+esc(s.tr.join('  ·  '))+'</div>';
    if(s.abs)h+='<div class="info">'+fmtText(s.abs)+'</div>';
    if(s.pr&&s.pr.length){
      h+='<div class="subheat">'+s.pr.length+' Presentation'+(s.pr.length>1?'s':'')+'</div>';
      s.pr.forEach(function(p,i){
        var pres=(p.sp||[]).map(function(x){return x.n+(x.a?' ('+x.a+')':'');});
        var tline=(p.t1?p.t1:'')+(p.t2?' – '+p.t2:'');
        var bb=bodyBlock(p);
        var lbl=p.abs?'abstract':'authors';
        h+='<div class="pres" data-pres="'+i+'">'+
             '<button class="star pres-star'+(stars.has(p.id)?' on':'')+'" data-star="'+p.id+'" title="Add to My Schedule">'+(stars.has(p.id)?ICON.starFill:ICON.star)+'</button>'+
             '<div class="pres-body">'+
               '<div class="pres-t"><span class="pres-time">'+esc(tline)+'</span>'+
               '<span class="pres-title">'+esc(p.t)+'</span></div>'+
               (pres.length?'<div class="pres-people">'+esc(pres.join('; '))+'</div>':'')+
               (bb?'<div class="pres-abs">'+bb+'</div><span class="pres-more js-absmore" data-label="'+lbl+'">Show '+lbl+'</span>':'')+
             '</div>'+
           '</div>';
      });
    }
    return h;
  }


  var ICON={
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
    chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
    starFill:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
  };

  // ---- update facet counts + active classes ----
  function updateFacetCounts(){
    document.querySelectorAll('.opt[data-dim]').forEach(function(el){
      var dim=el.getAttribute('data-dim'),val=el.getAttribute('data-val');
      var active=state[dim].has(val);
      el.classList.toggle('on',active);
      var n=facetCount(dim,val);
      var c=el.querySelector('[data-count]');
      if(c)c.textContent=n;
      el.style.display=(n===0&&!active)?'none':'';
    });
    // section active state
    document.querySelectorAll('.side-sec[data-sec]').forEach(function(sec){
      var dim=sec.getAttribute('data-sec');
      sec.classList.toggle('has-active',state[dim].size>0);
    });
    // day chips
    document.querySelectorAll('.chip[data-day]').forEach(function(el){
      var d=el.getAttribute('data-day');
      el.classList.toggle('on',state.days.has(d));
      var c=el.querySelector('[data-daycount]');
      var dc=facetCount('days',d);
      if(c)c.textContent=dc;
      el.classList.toggle('zero',dc===0&&!state.days.has(d));
    });
    // star toggle
    var stEl=document.getElementById('starToggle');if(stEl)stEl.classList.toggle('on',state.starOnly);
    var scEl=document.getElementById('starCount');if(scEl)scEl.textContent=scheduleItems().length;
    // reset btn
    var any=state.q||state.days.size||state.types.size||state.tracks.size||state.rooms.size||state.starOnly;
    var rb=document.getElementById('resetBtn');if(rb)rb.disabled=!any;
  }

  // ---- events ----
  function toggleSet(set,val){if(set.has(val))set.delete(val);else set.add(val);}

  document.querySelector('.viewswitch').addEventListener('click',function(e){
    var b=e.target.closest('[data-view]');if(b)setView(b.getAttribute('data-view'));
  });

  document.getElementById('filters').addEventListener('click',function(e){
    // calendar agenda: remove item / clear all
    if(e.target.closest('#clearSched')){scheduleItems().forEach(function(it){stars.delete(it.id);});saveStars();buildCalendarNav();render();return;}
    if(state.view==='calendar'){
      var st=e.target.closest('[data-star]');
      if(st){toggleSet(stars,st.getAttribute('data-star'));saveStars();buildCalendarNav();render();return;}
    }
    // poster nav
    var pnav=e.target.closest('.pnav');
    if(pnav){state.pSession=pnav.getAttribute('data-psession');state.pTracks.clear();state.q='';document.getElementById('q').value='';render();return;}
    var opt=e.target.closest('.opt');
    var clr=e.target.closest('[data-clear]');
    var reset=e.target.closest('#resetBtn');
    if(reset){resetAll();return;}
    if(clr){var d=clr.getAttribute('data-clear');state[d].clear();render();return;}
    if(opt){
      if(opt.id==='starToggle'){state.starOnly=!state.starOnly;render();return;}
      var dim=opt.getAttribute('data-dim'),val=opt.getAttribute('data-val');
      toggleSet(state[dim],val);render();
    }
  });

  document.getElementById('daybar').addEventListener('click',function(e){
    // poster toolbar
    var ptrack=e.target.closest('[data-ptrack]');
    if(ptrack){toggleSet(state.pTracks,ptrack.getAttribute('data-ptrack'));render();return;}
    var psort=e.target.closest('[data-psort]');
    if(psort){state.pSort=psort.getAttribute('data-psort');render();return;}
    var chip=e.target.closest('.chip[data-day]');
    var exp=e.target.closest('[data-exp]');
    if(chip){toggleSet(state.days,chip.getAttribute('data-day'));render();}
    if(exp){
      var on=exp.getAttribute('data-exp')==='1';
      document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on');});exp.classList.add('on');
      if(on){D.sessions.forEach(function(s){if(matches(s,null))openCards.add(s.id);});}
      else openCards.clear();
      render();
    }
  });

  document.getElementById('list').addEventListener('click',function(e){
    var star=e.target.closest('[data-star]');
    if(star){
      e.stopPropagation();
      var id=star.getAttribute('data-star');
      toggleSet(stars,id);saveStars();
      star.classList.toggle('on',stars.has(id));
      star.innerHTML=stars.has(id)?ICON.starFill:ICON.star;
      if(state.view==='posters'){
        // if viewing picks, drop it; otherwise just refresh sidebar picks count
        var pk=document.querySelector('.pnav[data-psession="__picks__"] .n');if(pk)pk.textContent=starredPosters().length;
        if(state.pSession==='__picks__')render();
      }else if(state.view==='calendar'){
        buildCalendarNav();render();
      }else{
        var scEl=document.getElementById('starCount');if(scEl)scEl.textContent=scheduleItems().length;
        if(state.starOnly)render();
      }
      return;
    }
    // calendar card (or nested talk) -> jump to detail
    if(state.view==='calendar'){
      var ev=e.target.closest('[data-evid]');
      if(ev){goToItem(ev.getAttribute('data-evid'));return;}
    }
    // poster row expand
    var ptog=e.target.closest('.js-ptoggle');
    if(ptog){var pc=ptog.closest('.poster');var pid=pc.getAttribute('data-pid');
      if(openPosters.has(pid))openPosters.delete(pid);else openPosters.add(pid);
      pc.classList.toggle('exp');return;}
    var more=e.target.closest('.js-absmore');
    if(more){var pres=more.closest('.pres');pres.classList.toggle('exp');var lb=more.getAttribute('data-label')||'abstract';more.textContent=(pres.classList.contains('exp')?'Hide ':'Show ')+lb;return;}
    var row=e.target.closest('.js-toggle');
    if(row){
      var card=row.closest('.card');var id=card.getAttribute('data-id');
      var s=D.sessions.find(function(x){return x.id===id;});
      if(openCards.has(id)){openCards.delete(id);card.classList.remove('open');card.querySelector('.detail').innerHTML='';}
      else{openCards.add(id);card.classList.add('open');card.querySelector('.detail').innerHTML=detailHTML(s);}
    }
  });

  var qEl=document.getElementById('q');
  var qt;
  qEl.addEventListener('input',function(){
    clearTimeout(qt);
    qt=setTimeout(function(){state.q=qEl.value.trim().toLowerCase();render();},130);
  });

  function resetAll(){
    state.q='';qEl.value='';state.days.clear();state.types.clear();state.tracks.clear();state.rooms.clear();state.starOnly=false;
    render();
  }

  // keyboard
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}
    if(e.key==='Escape'){if(document.activeElement===qEl){qEl.blur();}closeSidebar();}
  });

  // mobile sidebar
  function closeSidebar(){document.getElementById('sidebar').classList.remove('show');document.getElementById('scrim').classList.remove('show');}
  document.getElementById('menuBtn').addEventListener('click',function(){document.getElementById('sidebar').classList.add('show');document.getElementById('scrim').classList.add('show');});
  document.getElementById('scrim').addEventListener('click',closeSidebar);

  // ---- init ----
  buildFilters();
  buildDayBar();
  render();
})();
</script>
