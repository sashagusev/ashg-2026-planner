<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASHG 2026 · Program Planner</title>
<meta name="description" content="An elegant, fast planner for the ASHG 2026 Annual Meeting program — filter sessions by day, track, type, and room." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#08090a;
  --bg-1:#0c0d0f;
  --bg-2:#101113;
  --panel:#0f1012;
  --elevated:#141517;
  --border:#1c1d21;
  --border-2:#26272c;
  --text:#e6e7ea;
  --text-2:#a0a2a8;
  --text-3:#6c6e76;
  --accent:#7c85f3;
  --accent-2:#5b64d6;
  --accent-soft:rgba(124,133,243,.14);
  --star:#f5c542;
  --radius:10px;
  --radius-sm:7px;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.28);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-soft);color:#fff}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#25262b;border-radius:6px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:#33343a}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.sidebar{
  border-right:1px solid var(--border);
  background:var(--bg-1);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:0;
}
.main{min-width:0;display:flex;flex-direction:column}
.scrim{display:none}

/* ---------- Header ---------- */
.brand{
  display:flex;align-items:center;gap:11px;
  padding:18px 20px 16px;
}
.brand .logo{
  width:30px;height:30px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,#7c85f3,#b06ab3 55%,#e2607a);
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset;
  display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px;letter-spacing:.02em;
}
.brand h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--text-3);margin-top:1px}

.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(8,9,10,.78);
  backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--border);
  padding:12px 22px;
  display:flex;align-items:center;gap:14px;
}
.search{
  position:relative;flex:1;max-width:520px;
}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search input{
  width:100%;background:var(--bg-2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:8px 30px 8px 34px;font-size:13.5px;outline:none;
  transition:border-color .12s,box-shadow .12s;
}
.search input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.search input::placeholder{color:var(--text-3)}
.search .kbd{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--text-3);border:1px solid var(--border-2);border-radius:5px;
  padding:1px 6px;background:var(--bg-1);pointer-events:none;
}
.topbar .count{margin-left:auto;color:var(--text-3);font-size:12.5px;white-space:nowrap}

/* ---------- Sidebar filter groups ---------- */
.side-sec{padding:6px 12px 14px}
.side-sec + .side-sec{border-top:1px solid var(--border)}
.side-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 8px 6px;color:var(--text-3);
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
}
.side-head .clr{
  color:var(--text-3);font-size:11px;text-transform:none;letter-spacing:0;
  background:none;border:none;padding:2px 4px;border-radius:5px;visibility:hidden;
}
.side-head .clr:hover{color:var(--text);background:var(--bg-2)}
.side-sec.has-active .clr{visibility:visible}
.opt{
  display:flex;align-items:center;gap:9px;
  padding:6px 8px;border-radius:7px;color:var(--text-2);
  font-size:13px;user-select:none;cursor:pointer;position:relative;
  transition:background .1s,color .1s;
}
.opt:hover{background:var(--bg-2);color:var(--text)}
.opt .box{
  width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border-2);
  flex:none;display:grid;place-items:center;transition:all .12s;
}
.opt .box svg{width:10px;height:10px;opacity:0;transform:scale(.6);transition:all .12s}
.opt.on .box{background:var(--accent);border-color:var(--accent)}
.opt.on .box svg{opacity:1;transform:scale(1)}
.opt.on{color:var(--text)}
.opt .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .n{color:var(--text-3);font-size:11.5px;font-variant-numeric:tabular-nums}
.opt .dot{width:8px;height:8px;border-radius:3px;flex:none}

.side-reset{
  margin:2px 8px 8px;width:calc(100% - 16px);
  background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);
  padding:8px;border-radius:8px;font-size:12.5px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.side-reset:hover{color:var(--text);border-color:var(--border-2)}
.side-reset:disabled{opacity:.4;cursor:default}

/* ---------- Day chips (top of list) ---------- */
.daybar{
  display:flex;gap:7px;padding:14px 22px 4px;flex-wrap:wrap;align-items:center;
}
.chip{
  background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);
  padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:all .12s;
}
.chip:hover{color:var(--text);border-color:var(--border-2)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:#cdd1fb;box-shadow:0 0 0 1px var(--accent-2) inset}
.chip .c{color:var(--text-3);margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on .c{color:#a9b0f5}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{background:none;border:none;color:var(--text-3);padding:6px 11px;font-size:12.5px;font-weight:500}
.seg button.on{background:var(--elevated);color:var(--text)}

/* ---------- Session list ---------- */
.list{padding:6px 22px 80px;max-width:1080px}
.daygroup{margin-top:18px}
.daygroup-h{
  position:sticky;top:57px;z-index:10;
  display:flex;align-items:baseline;gap:10px;padding:8px 2px;margin-bottom:4px;
  background:linear-gradient(var(--bg) 62%,rgba(8,9,10,0));
}
.daygroup-h .d{font-size:13px;font-weight:600;letter-spacing:-.01em}
.daygroup-h .n{font-size:12px;color:var(--text-3)}

.card{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);
  margin-bottom:8px;overflow:hidden;transition:border-color .12s,background .12s;
}
.card:hover{border-color:var(--border-2)}
.card.open{border-color:var(--border-2);background:var(--bg-1)}
.card-row{display:grid;grid-template-columns:88px 1fr auto;gap:14px;padding:13px 14px;cursor:pointer;align-items:start}
.time{
  font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;padding-top:1px;line-height:1.35;
}
.time .t1{color:var(--text);font-weight:500;display:block}
.time .t2{color:var(--text-3);display:block}
.body{min-width:0}
.title{font-size:14px;font-weight:550;letter-spacing:-.01em;color:var(--text);margin:0 0 6px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.badge{
  font-size:11px;font-weight:500;padding:2.5px 8px;border-radius:6px;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.badge .dot{width:7px;height:7px;border-radius:2px}
.badge.type{background:var(--bg-2);color:var(--text-2);border:1px solid var(--border)}
.tag{font-size:11.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:4px}
.tag svg{width:12px;height:12px;opacity:.75;flex:none}
.tag.room{color:var(--text-2)}
.people{color:var(--text-3);font-size:12px;margin-top:7px;line-height:1.45}
.people b{color:var(--text-2);font-weight:500}
.card-side{display:flex;align-items:center;gap:2px}
.star{
  background:none;border:none;padding:6px;border-radius:7px;color:var(--text-3);
  display:grid;place-items:center;transition:all .12s;
}
.star:hover{background:var(--bg-2);color:var(--star)}
.star.on{color:var(--star)}
.star svg{width:17px;height:17px}
.chev{color:var(--text-3);padding:6px;display:grid;place-items:center;transition:transform .18s}
.card.open .chev{transform:rotate(90deg)}

/* ---------- Expanded detail ---------- */
.detail{border-top:1px solid var(--border);padding:0 14px;display:none}
.card.open .detail{display:block;padding:14px 14px 16px}
.detail .info{color:var(--text-2);font-size:13px;line-height:1.6;margin-bottom:2px}
.detail .info p{margin:0 0 9px}
.detail .info a{color:var(--accent);word-break:break-word}
.detail .info b,.detail .info strong{color:var(--text);font-weight:600}
.detail .info br{content:"";display:block;margin:2px 0}
.detail-people{display:flex;flex-direction:column;gap:5px;margin:12px 0 2px}
.pgroup{font-size:12.5px;color:var(--text-2)}
.pgroup .role{color:var(--text-3);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;font-weight:600;margin-right:8px}
.person{color:var(--text);}
.person .aff{color:var(--text-3)}
.subheat{margin-top:16px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:8px}
.subheat::after{content:"";height:1px;background:var(--border);flex:1}
.pres{border-left:2px solid var(--border-2);padding:9px 0 9px 14px;margin:10px 0 0 4px}
.pres + .pres{margin-top:2px}
.pres-t{display:flex;gap:12px;align-items:baseline}
.pres-time{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:70px}
.pres-title{font-size:13px;color:var(--text);font-weight:500;line-height:1.4}
.pres-people{font-size:12px;color:var(--text-3);margin-top:3px}
.pres-abs{font-size:12.5px;color:var(--text-2);line-height:1.55;margin-top:6px;display:none}
.pres.exp .pres-abs{display:block}
.pres-more{font-size:11.5px;color:var(--accent);cursor:pointer;margin-top:5px;display:inline-block}
.pres-abs p{margin:0 0 7px}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:80px 20px;color:var(--text-3)}
.empty h3{color:var(--text-2);font-weight:600;margin:0 0 6px;font-size:15px}
.loading{padding:60px;text-align:center;color:var(--text-3)}

/* mobile */
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:60;width:280px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.show{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}
  .scrim.show{display:block}
  .menu-btn{display:grid;place-items:center;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);width:34px;height:34px;border-radius:8px;flex:none}
  .search .kbd{display:none}
  .card-row{grid-template-columns:70px 1fr auto;gap:10px}
  .list,.daybar,.topbar{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">AS</div>
      <div>
        <h1>ASHG 2026</h1>
        <div class="sub">Montréal · Oct 18–24</div>
      </div>
    </div>
    <div id="filters"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Filters">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="text" placeholder="Search sessions, speakers, abstracts…" autocomplete="off" spellcheck="false" />
        <span class="kbd">/</span>
      </div>
      <div class="count" id="count"></div>
    </div>

    <div class="daybar" id="daybar"></div>
    <div class="list" id="list"><div class="loading">Loading program…</div></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var D = window.ASHG_DATA;
  if(!D){document.getElementById('list').innerHTML='<div class="empty"><h3>Could not load data</h3><p>data.js is missing.</p></div>';return;}

  // ---- track colors ----
  var TRACK_COLORS = ['#7c85f3','#e2607a','#4cc4a0','#e6a94c','#b06ab3','#5aa9e6','#e07a5f','#8bc34a','#c56cf0','#4db6ac','#f06292','#9575cd','#64b5f6','#ffb74d'];
  var trackColor = {};
  D.tracks.forEach(function(t,i){trackColor[t]=TRACK_COLORS[i%TRACK_COLORS.length];});

  var TYPE_COLORS = {
    'Plenary Sessions':'#e2607a','Platform Sessions':'#7c85f3','Poster Presentations':'#4cc4a0',
    'Featured Symposia':'#c56cf0','Workshops and Courses':'#e6a94c','Lightning Talks':'#5aa9e6',
    'Industry Events':'#8a8f98','Ancillary Events':'#8a8f98','Networking and Social Events':'#e07a5f',
    'Professional Education Sessions':'#64b5f6'
  };
  function typeColor(t){return TYPE_COLORS[t]||'#8a8f98';}

  // ---- state ----
  var state={q:'',days:new Set(),types:new Set(),tracks:new Set(),rooms:new Set(),starOnly:false};
  var stars=new Set(JSON.parse(localStorage.getItem('ashg_stars')||'[]'));
  function saveStars(){localStorage.setItem('ashg_stars',JSON.stringify([].concat(Array.from(stars))));}
  var openCards=new Set();

  // ---- precompute search text ----
  D.sessions.forEach(function(s){
    var parts=[s.t,s.sub].concat(s.tr,s.st,s.rm);
    [].concat(s.sp,s.ch,s.mo).forEach(function(p){if(p)parts.push(p.n,p.a);});
    if(s.info)parts.push(strip(s.info));
    (s.pr||[]).forEach(function(p){
      parts.push(p.t);(p.sp||[]).forEach(function(x){if(x)parts.push(x.n,x.a);});
      if(p.info)parts.push(strip(p.info));
    });
    s._search=parts.join('  ').toLowerCase();
  });

  function strip(html){var d=document.createElement('div');d.innerHTML=html;return d.textContent||'';}
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  // ---- counts helper (respects OTHER active filters, faceted) ----
  function matches(s,ignore){
    if(state.starOnly && !stars.has(s.id))return false;
    if(ignore!=='q' && state.q){if(s._search.indexOf(state.q)===-1)return false;}
    if(ignore!=='days' && state.days.size && !state.days.has(s.day))return false;
    if(ignore!=='types' && state.types.size && !s.st.some(function(t){return state.types.has(t);}))return false;
    if(ignore!=='tracks' && state.tracks.size){
      if(state.tracks.has('__none__')){ if(s.tr.length && !s.tr.some(function(t){return state.tracks.has(t);}))return false; }
      else if(!s.tr.some(function(t){return state.tracks.has(t);}))return false;
    }
    if(ignore!=='rooms' && state.rooms.size && !s.rm.some(function(r){return state.rooms.has(r);}))return false;
    return true;
  }
  function facetCount(dim,val){
    var n=0;
    for(var i=0;i<D.sessions.length;i++){
      var s=D.sessions[i];
      if(!matches(s,dim))continue;
      if(dim==='days'&&s.day===val)n++;
      else if(dim==='types'&&s.st.indexOf(val)>-1)n++;
      else if(dim==='tracks'){ if(val==='__none__'){if(!s.tr.length)n++;} else if(s.tr.indexOf(val)>-1)n++; }
      else if(dim==='rooms'&&s.rm.indexOf(val)>-1)n++;
    }
    return n;
  }

  // ---- build sidebar ----
  var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>';
  var typeCounts={},roomCounts={},noTrackCount=0;
  D.sessions.forEach(function(s){
    s.st.forEach(function(t){typeCounts[t]=(typeCounts[t]||0)+1;});
    s.rm.forEach(function(r){roomCounts[r]=(roomCounts[r]||0)+1;});
    if(!s.tr.length)noTrackCount++;
  });

  function buildFilters(){
    var h='';
    // reset
    h+='<div style="padding:10px 12px 4px"><button class="side-reset" id="resetBtn" disabled>'+
       '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v6h6"/><path d="M3.5 8a9 9 0 1 0 2.3-3.5L3 8"/></svg>'+
       'Reset all filters</button></div>';
    // My schedule
    h+='<div class="side-sec"><div class="opt" id="starToggle" data-toggle="star">'+
       '<span class="box">'+CHECK+'</span><span class="lbl" style="color:var(--star);font-weight:500">★ My Schedule</span>'+
       '<span class="n" id="starCount">'+stars.size+'</span></div></div>';
    // Session type
    h+=group('Session type','types',D.sessionTypes.map(function(t){return{v:t,label:t,color:typeColor(t)};}));
    // Track
    var tr=D.tracks.map(function(t){return{v:t,label:t,color:trackColor[t]};});
    tr.push({v:'__none__',label:'No track assigned',color:'#3a3b40'});
    h+=group('Track','tracks',tr);
    // Room
    h+=group('Room','rooms',D.rooms.map(function(r){return{v:r,label:r};}));
    document.getElementById('filters').innerHTML=h;
  }
  function group(title,dim,items){
    var h='<div class="side-sec" data-sec="'+dim+'"><div class="side-head"><span>'+title+'</span>'+
      '<button class="clr" data-clear="'+dim+'">Clear</button></div>';
    items.forEach(function(it){
      h+='<div class="opt" data-dim="'+dim+'" data-val="'+esc(it.v)+'">'+
         '<span class="box">'+CHECK+'</span>'+
         (it.color?'<span class="dot" style="background:'+it.color+'"></span>':'')+
         '<span class="lbl">'+esc(it.label)+'</span>'+
         '<span class="n" data-count>0</span></div>';
    });
    return h+'</div>';
  }

  // ---- day bar ----
  function buildDayBar(){
    var h='';
    D.days.forEach(function(d){
      h+='<button class="chip" data-day="'+d.d+'">'+d.l+'<span class="c" data-daycount="'+d.d+'"></span></button>';
    });
    h+='<div class="seg"><button data-exp="0" class="on">Collapse</button><button data-exp="1">Expand all</button></div>';
    document.getElementById('daybar').innerHTML=h;
  }

  // ---- render list ----
  function render(){
    var filtered=D.sessions.filter(function(s){return matches(s,null);});
    // group by day
    var groups={},order=[];
    filtered.forEach(function(s){
      if(!groups[s.day]){groups[s.day]=[];order.push(s.day);}
      groups[s.day].push(s);
    });
    var html='';
    if(!filtered.length){
      html='<div class="empty"><h3>No sessions match</h3><p>Try removing a filter or clearing the search.</p></div>';
    }
    order.forEach(function(day){
      var arr=groups[day];var dl=arr[0].dl;
      html+='<div class="daygroup"><div class="daygroup-h"><span class="d">'+dl+'</span><span class="n">'+arr.length+' session'+(arr.length>1?'s':'')+'</span></div>';
      arr.forEach(function(s){html+=cardHTML(s);});
      html+='</div>';
    });
    var list=document.getElementById('list');
    list.innerHTML=html;
    // counts
    document.getElementById('count').textContent=filtered.length+' of '+D.sessions.length+' sessions';
    updateFacetCounts();
  }

  function cardHTML(s){
    var open=openCards.has(s.id);
    var tc=typeColor(s.st[0]);
    var typeBadge=s.st.length?'<span class="badge type"><span class="dot" style="background:'+tc+'"></span>'+esc(s.st[0])+'</span>':'';
    var trackTags=s.tr.map(function(t){return '<span class="tag"><span class="dot" style="width:7px;height:7px;border-radius:2px;background:'+(trackColor[t]||'#666')+'"></span>'+esc(t)+'</span>';}).join('');
    var room=s.rm.length?'<span class="tag room">'+ICON.pin+esc(s.rm.join(', '))+'</span>':'';
    var sub=s.sub&&!s.st.length?'<span class="badge type">'+esc(s.sub)+'</span>':'';
    // people summary
    var lead=[];
    if(s.ch.length)lead.push('<b>'+esc(s.ch.map(nm).join(', '))+'</b>');
    var people='';
    var chairs=s.ch.length?'<b>Chairs:</b> '+esc(s.ch.map(nm).join(', ')):'';
    var speakers=s.sp.length?'<b>Speakers:</b> '+esc(shorten(s.sp)):'';
    var mods=s.mo.length?'<b>Moderators:</b> '+esc(s.mo.map(nm).join(', ')):'';
    var pl=[chairs,mods,speakers].filter(Boolean).slice(0,2).join(' &nbsp;·&nbsp; ');
    if(pl)people='<div class="people">'+pl+'</div>';
    var prCount=(s.pr||[]).length;
    var prBadge=prCount?'<span class="tag">'+ICON.list+prCount+' presentation'+(prCount>1?'s':'')+'</span>':'';

    return '<div class="card'+(open?' open':'')+'" data-id="'+s.id+'">'+
      '<div class="card-row js-toggle">'+
        '<div class="time"><span class="t1">'+esc(s.t1)+'</span><span class="t2">'+(s.dur?esc(s.dur):esc(s.t2))+'</span></div>'+
        '<div class="body">'+
          '<div class="title">'+esc(s.t)+'</div>'+
          '<div class="meta">'+typeBadge+sub+trackTags+room+prBadge+'</div>'+
          people+
        '</div>'+
        '<div class="card-side">'+
          '<button class="star'+(stars.has(s.id)?' on':'')+'" data-star="'+s.id+'" title="Add to My Schedule">'+(stars.has(s.id)?ICON.starFill:ICON.star)+'</button>'+
          '<span class="chev">'+ICON.chev+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="detail">'+(open?detailHTML(s):'')+'</div>'+
    '</div>';
  }
  function nm(p){return p.n;}
  function shorten(arr){var names=arr.map(nm);if(names.length>4)return names.slice(0,4).join(', ')+' +'+(names.length-4)+' more';return names.join(', ');}

  function detailHTML(s){
    var h='';
    if(s.info)h+='<div class="info">'+sanitize(s.info)+'</div>';
    var groups=[['Chairs',s.ch],['Moderators',s.mo],['Speakers',s.sp]];
    var pe='';
    groups.forEach(function(g){
      if(g[1]&&g[1].length){
        pe+='<div class="pgroup"><span class="role">'+g[0]+'</span>'+g[1].map(function(p){
          return '<span class="person">'+esc(p.n)+(p.a?' <span class="aff">· '+esc(p.a)+'</span>':'')+'</span>';
        }).join('<span class="aff">,  </span>')+'</div>';
      }
    });
    if(pe)h+='<div class="detail-people">'+pe+'</div>';
    if(s.pr&&s.pr.length){
      h+='<div class="subheat">'+s.pr.length+' Presentation'+(s.pr.length>1?'s':'')+'</div>';
      s.pr.forEach(function(p,i){
        var pres=(p.sp||[]).map(function(x){return x.n+(x.a?' ('+x.a+')':'');});
        var tline=(p.t1?p.t1:'')+(p.t2?' – '+p.t2:'');
        h+='<div class="pres" data-pres="'+i+'">'+
             '<div class="pres-t"><span class="pres-time">'+esc(tline)+'</span>'+
             '<span class="pres-title">'+esc(p.t)+'</span></div>'+
             (pres.length?'<div class="pres-people">'+esc(pres.join('; '))+'</div>':'')+
             (p.info?'<div class="pres-abs">'+sanitize(p.info)+'</div><span class="pres-more js-absmore">Show abstract</span>':'')+
           '</div>';
      });
    }
    return h;
  }

  // very small allowlist sanitizer for the CMS html (a,p,b,strong,i,em,ul,ol,li,br)
  function sanitize(html){
    var d=document.createElement('div');d.innerHTML=html;
    (function walk(node){
      var kids=[].slice.call(node.childNodes);
      kids.forEach(function(c){
        if(c.nodeType===1){
          var tag=c.tagName.toLowerCase();
          if(['script','style','iframe','img','svg','object'].indexOf(tag)>-1){c.remove();return;}
          [].slice.call(c.attributes).forEach(function(a){
            if(tag==='a'&&(a.name==='href')){
              if(/^https?:/i.test(c.getAttribute('href')||'')){c.setAttribute('target','_blank');c.setAttribute('rel','noopener noreferrer');}
              else c.removeAttribute('href');
            } else c.removeAttribute(a.name);
          });
          walk(c);
        }
      });
    })(d);
    return d.innerHTML;
  }

  var ICON={
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
    chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
    starFill:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
  };

  // ---- update facet counts + active classes ----
  function updateFacetCounts(){
    document.querySelectorAll('.opt[data-dim]').forEach(function(el){
      var dim=el.getAttribute('data-dim'),val=el.getAttribute('data-val');
      var active=state[dim].has(val);
      el.classList.toggle('on',active);
      var n=facetCount(dim,val);
      var c=el.querySelector('[data-count]');
      if(c)c.textContent=n;
      el.style.display=(n===0&&!active)?'none':'';
    });
    // section active state
    document.querySelectorAll('.side-sec[data-sec]').forEach(function(sec){
      var dim=sec.getAttribute('data-sec');
      sec.classList.toggle('has-active',state[dim].size>0);
    });
    // day chips
    document.querySelectorAll('.chip[data-day]').forEach(function(el){
      var d=el.getAttribute('data-day');
      el.classList.toggle('on',state.days.has(d));
      var c=el.querySelector('[data-daycount]');
      if(c)c.textContent=facetCount('days',d);
    });
    // star toggle
    var stEl=document.getElementById('starToggle');if(stEl)stEl.classList.toggle('on',state.starOnly);
    document.getElementById('starCount').textContent=stars.size;
    // reset btn
    var any=state.q||state.days.size||state.types.size||state.tracks.size||state.rooms.size||state.starOnly;
    var rb=document.getElementById('resetBtn');if(rb)rb.disabled=!any;
  }

  // ---- events ----
  function toggleSet(set,val){if(set.has(val))set.delete(val);else set.add(val);}

  document.getElementById('filters').addEventListener('click',function(e){
    var opt=e.target.closest('.opt');
    var clr=e.target.closest('[data-clear]');
    var reset=e.target.closest('#resetBtn');
    if(reset){resetAll();return;}
    if(clr){var d=clr.getAttribute('data-clear');state[d].clear();render();return;}
    if(opt){
      if(opt.id==='starToggle'){state.starOnly=!state.starOnly;render();return;}
      var dim=opt.getAttribute('data-dim'),val=opt.getAttribute('data-val');
      toggleSet(state[dim],val);render();
    }
  });

  document.getElementById('daybar').addEventListener('click',function(e){
    var chip=e.target.closest('.chip[data-day]');
    var exp=e.target.closest('[data-exp]');
    if(chip){toggleSet(state.days,chip.getAttribute('data-day'));render();}
    if(exp){
      var on=exp.getAttribute('data-exp')==='1';
      document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on');});exp.classList.add('on');
      if(on){D.sessions.forEach(function(s){if(matches(s,null))openCards.add(s.id);});}
      else openCards.clear();
      render();
    }
  });

  document.getElementById('list').addEventListener('click',function(e){
    var star=e.target.closest('[data-star]');
    if(star){
      e.stopPropagation();
      var id=star.getAttribute('data-star');
      toggleSet(stars,id);saveStars();
      star.classList.toggle('on',stars.has(id));
      star.innerHTML=stars.has(id)?ICON.starFill:ICON.star;
      document.getElementById('starCount').textContent=stars.size;
      if(state.starOnly)render();
      return;
    }
    var more=e.target.closest('.js-absmore');
    if(more){var pres=more.closest('.pres');pres.classList.toggle('exp');more.textContent=pres.classList.contains('exp')?'Hide abstract':'Show abstract';return;}
    var row=e.target.closest('.js-toggle');
    if(row){
      var card=row.closest('.card');var id=card.getAttribute('data-id');
      var s=D.sessions.find(function(x){return x.id===id;});
      if(openCards.has(id)){openCards.delete(id);card.classList.remove('open');card.querySelector('.detail').innerHTML='';}
      else{openCards.add(id);card.classList.add('open');card.querySelector('.detail').innerHTML=detailHTML(s);}
    }
  });

  var qEl=document.getElementById('q');
  var qt;
  qEl.addEventListener('input',function(){
    clearTimeout(qt);
    qt=setTimeout(function(){state.q=qEl.value.trim().toLowerCase();render();},130);
  });

  function resetAll(){
    state.q='';qEl.value='';state.days.clear();state.types.clear();state.tracks.clear();state.rooms.clear();state.starOnly=false;
    render();
  }

  // keyboard
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}
    if(e.key==='Escape'){if(document.activeElement===qEl){qEl.blur();}closeSidebar();}
  });

  // mobile sidebar
  function closeSidebar(){document.getElementById('sidebar').classList.remove('show');document.getElementById('scrim').classList.remove('show');}
  document.getElementById('menuBtn').addEventListener('click',function(){document.getElementById('sidebar').classList.add('show');document.getElementById('scrim').classList.add('show');});
  document.getElementById('scrim').addEventListener('click',closeSidebar);

  // ---- init ----
  buildFilters();
  buildDayBar();
  render();
})();
</script>
</body>
</html>
